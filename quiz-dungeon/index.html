<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03040a">
<title>クイズダンジョン山札試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Oxanium:wght@500;700;800&display=swap">
<style>
  /* 見た目の決まりは Compile の docs/design.md に合わせる：夜の電子盤、自分＝紫・相手（敵）＝桃、角は左上と右下を斜めに切る、英字は飾りだけ */
  :root {
    --bg: #03040a;
    --panel: rgba(12, 9, 20, .9);
    --panel-2: rgba(28, 20, 46, .92);
    --edge: rgba(185, 164, 255, .22);
    --ink: #f1edf8;
    --dim: rgba(241, 237, 248, .58);
    --foe: #ff4fa3;          /* 相手・負け・強調の1点 */
    --you: #8b5cf6;          /* 自分・味方・勝ち */
    --you-2: #a07bff;
    --lav: #b9a4ff;          /* 枠線・区切り */
    --prize: #ffb3da;        /* 金の代わり：レベル・ごほうび・大事な数字 */
    --font-logo: "Orbitron", system-ui, sans-serif;
    --font-ui: "Oxanium", system-ui, sans-serif;
    --font-jp: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    --cut: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    --cut-s: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    --line2: linear-gradient(90deg, var(--you), var(--foe));
    /* ジャンルの色は札の中だけで使う（画面の枠やボタンには使わない） */
    --g-anime: #ff8a5c; --g-game: #5cc8ff; --g-sports: #7ee36a; --g-music: #ff6fd8; --g-movie: #ffd166;
    --g-history: #d9a066; --g-geo: #4fd1b5; --g-science: #8fb3ff; --g-food: #ffa94d; --g-words: #c7c7d9;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(139, 92, 246, .18), transparent 60%),
      radial-gradient(90% 50% at 100% 110%, rgba(255, 79, 163, .10), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink); font-family: var(--font-jp);
    font-size: 15px; line-height: 1.6;
    /* ホーム画面から開くと時計の帯・ホームバー・横持ちのノッチに潜るので安全域を足す */
    padding:
      max(10px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
  }
  #app { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  #app > div:empty { display: none; }
  h1, h2 { font-weight: 800; margin: 0; line-height: 1.3; text-wrap: balance; }
  h1 { font-size: clamp(1.4rem, 5.6vw, 1.9rem); }
  h2 { font-size: 1rem; }
  p { margin: 0; }
  .kick { display: block; font-family: var(--font-ui); font-weight: 700; font-size: .7rem; letter-spacing: .32em; color: var(--lav); }
  button {
    font: inherit; color: inherit; cursor: pointer;
    border: 1px solid var(--edge); background: var(--panel-2);
    border-radius: 0; clip-path: var(--cut-s);
    padding: 10px 14px; min-height: 40px;
    transition: background .15s, border-color .15s, transform .08s;
  }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--lav); outline-offset: -3px; }
  button:disabled { opacity: .35; cursor: default; }
  /* 押せない状態は薄く。ただし押したら理由を出す（黙って無反応にしない） */
  button.off { opacity: .42; }
  .muted { color: var(--dim); }
  .num { font-family: var(--font-ui); font-weight: 700; font-variant-numeric: tabular-nums; }

  /* 板：半透明の濃い色＋上辺に2色の細い線 */
  .panel, .card, .stage, #b-top, .log, .guide {
    position: relative; background: var(--panel); border: 1px solid var(--edge);
    border-radius: 0; clip-path: var(--cut);
  }
  .panel::before, .card::before, .stage::before, #b-top::before {  /* .top だと仲間の「Lv.top」まで板になっていた */
    content: ""; position: absolute; left: 10px; right: 0; top: 0; height: 2px; background: var(--line2); opacity: .85;
  }

  /* 上の帯：敵（桃）と共有体力（紫） */
  /* 上＝敵だけ（名前・弱点・体力）。共有体力と気力は下の仲間の帯へ移した */
  #b-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 9px 12px 10px; }
  #b-top .weak { font-size: .74rem; color: var(--dim); white-space: nowrap; }
  #b-top .weak b { color: var(--prize); }
  #b-top .where { min-width: 0; display: flex; align-items: baseline; gap: 8px; }
  #b-top .where .kick { font-size: .62rem; letter-spacing: .22em; color: var(--foe); flex: none; }
  #b-top .where b { font-weight: 800; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ki { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; color: var(--dim); }
  .ki i { width: 11px; height: 11px; transform: rotate(45deg); border: 1.5px solid var(--you-2); display: inline-block; }
  .ki i.on { background: var(--you-2); box-shadow: 0 0 8px rgba(160, 123, 255, .6); }
  .hpline { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; }
  .hpline .lbl { font-size: .7rem; letter-spacing: .06em; color: var(--dim); white-space: nowrap; width: 4.6em; }
  .hpline .num { width: 2.6em; text-align: right; font-size: .95rem; }
  .bar { flex: 1; height: 9px; background: rgba(255, 255, 255, .06); overflow: hidden; clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%); }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--you), var(--lav)); transition: width .25s; }
  .bar.foe > i { background: linear-gradient(90deg, #c2307a, var(--foe)); }
  .bar.time { flex: none; height: 3px; clip-path: none; }
  .bar.time > i { background: var(--line2); transition: none; }

  /* 予告の列：札の中だけジャンルの色を使う */
  .queue { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 6px; }
  .qc {
    position: relative; text-align: left; padding: 7px 8px 7px 11px; min-height: 0;
    border: 1px solid var(--edge); background: var(--panel);
    clip-path: var(--cut); display: flex; flex-direction: column; gap: 1px; min-width: 0; line-height: 1.35;
  }
  .qc::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 0; width: 4px; background: var(--gc, var(--lav)); }
  .qc .pos { font-family: var(--font-ui); font-weight: 700; font-size: .66rem; letter-spacing: .08em; color: var(--dim); white-space: nowrap; }
  .qc .g { font-weight: 800; font-size: .9rem; color: var(--gc, var(--lav)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qc .m { font-size: .72rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qc .m.mania { color: var(--prize); }
  .qc .m b { font-family: var(--font-ui); color: var(--prize); }
  .near { color: var(--prize); font-size: 1.1rem; }
  /* 担当は文字でなく札の右下の顔。いなければ「?」 */
  .qc .own { position: absolute; right: 6px; bottom: 6px; display: flex; gap: 2px; }
  .qc .own .face { width: 24px; height: 24px; }
  .qc .own i { width: 24px; height: 24px; display: grid; place-items: center; font-style: normal; font-family: var(--font-ui); font-weight: 800; color: var(--foe); border: 1px dashed var(--foe); clip-path: var(--cut-s); }
  /* 外したときの被弾が札でいちばん大きな数字 */
  .qc .hit { display: flex; flex-direction: column; line-height: 1.05; margin-top: 2px; }
  .qc .hit small { font-size: .62rem; color: var(--dim); }
  .qc .hit em { font-style: normal; font-family: var(--font-ui); font-weight: 800; font-size: 1.35rem; color: var(--foe); font-variant-numeric: tabular-nums; }
  .qc.mania { border-color: rgba(255, 179, 218, .55); }
  .lane { font-size: .74rem; color: var(--dim); display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .lane .kick { display: inline; font-size: .6rem; letter-spacing: .22em; color: var(--foe); }
  .qc.now { border-color: var(--lav); background: linear-gradient(180deg, rgba(139, 92, 246, .22), var(--panel) 70%); }
  .qc.now .pos { color: var(--lav); }
  .qc.lock { border-style: dashed; border-color: var(--foe); }
  .qc.sel { border: 1px solid var(--you-2); background: rgba(139, 92, 246, .32); }
  .qc.sel .pos::after { content: " ✓"; color: var(--ink); }
  .tag { display: inline-block; font-size: .64rem; padding: 0 4px; border: 1px solid currentColor; margin-right: 3px; clip-path: var(--cut-s); }
  .tag.t-big { color: var(--foe); }
  .tag.t-hard { color: var(--prize); }
  .tag.t-weak { color: var(--prize); }
  .tag.t-combo { color: var(--ink); background: var(--you-2); border-color: var(--you-2); }
  .qc.combo { box-shadow: inset 0 0 0 1px var(--you-2), 0 0 12px rgba(139, 92, 246, .55); }
  .qc .x { display: flex; flex-wrap: wrap; gap: 2px 0; min-height: 1.1em; }
  .qc .x:empty { display: none; }
  .hold { font-size: .8rem; color: var(--dim); }
  [data-g="anime"] { --gc: var(--g-anime); } [data-g="game"] { --gc: var(--g-game); } [data-g="sports"] { --gc: var(--g-sports); }
  [data-g="music"] { --gc: var(--g-music); } [data-g="movie"] { --gc: var(--g-movie); } [data-g="history"] { --gc: var(--g-history); }
  [data-g="geo"] { --gc: var(--g-geo); } [data-g="science"] { --gc: var(--g-science); } [data-g="food"] { --gc: var(--g-food); }
  [data-g="words"] { --gc: var(--g-words); }

  /* 札（ジャンル名の小札）。丸いピル形にしない */
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; clip-path: var(--cut-s); background: rgba(255, 255, 255, .06); border-left: 3px solid var(--gc, var(--lav)); font-size: .8rem; font-weight: 700; white-space: nowrap; }
  .chip.mania { border-left-color: var(--prize); color: var(--prize); }
  .chip.combo { border-left-color: var(--you-2); background: rgba(139, 92, 246, .22); color: var(--ink); font-family: var(--font-ui); }
  .chip.rate { border-left-color: var(--dim); color: var(--dim); font-weight: 400; }
  .chip.rate b { color: var(--ink); font-family: var(--font-ui); font-weight: 700; }
  .chip.combo b { font-family: var(--font-ui); color: var(--prize); }

  /* 問題 */
  .stage { padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; }
  /* 場：作戦と出題で高さを変えないよう、最低の高さを決めておく（下のボタンが上下に動かないように） */
  .field { min-height: 232px; }
  .phase .kick { display: inline; font-size: .6rem; letter-spacing: .22em; color: var(--lav); }
  .phase .sub { font-size: .74rem; color: var(--dim); }
  /* 場に出た札：手札の札と同じ形（左にジャンルの色、切り欠き）。裏返って問題文が出る */
  .fcard { position: relative; padding: 10px 12px 10px 15px; border: 1px solid var(--edge); background: var(--panel-2); clip-path: var(--cut); display: flex; flex-direction: column; gap: 6px; }
  .fcard::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 0; width: 5px; background: var(--gc, var(--lav)); }
  .fcard.lock { border: 1px dashed var(--foe); }
  .fhead { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 1.5em; }
  .fhit { margin-left: auto; font-size: .74rem; color: var(--dim); }
  .fhit em { font-style: normal; font-family: var(--font-ui); font-weight: 800; font-size: 1.05rem; color: var(--foe); }
  .fcard .back { font-family: var(--font-logo); font-weight: 900; font-size: 2rem; color: rgba(185, 164, 255, .35); }
  .fmeta { display: flex; flex-wrap: wrap; gap: 6px; min-height: 1.5em; }
  .fcard.flip { animation: flip .45s ease-out both; }
  @keyframes flip { from { transform: perspective(600px) rotateY(80deg); opacity: .3; } to { transform: none; opacity: 1; } }
  /* 結果は札が消える場所で見せる：正解は敵（上）へ、外れは下へ */
  .fcard.won { animation: won .6s ease-out both; border-color: var(--you-2); }
  .fcard.lost { animation: lost .6s ease-in both; border-color: var(--foe); }
  @keyframes won { to { transform: translateY(-10px); background-color: rgba(139, 92, 246, .28); } }
  @keyframes lost { to { transform: translateY(8px); background-color: rgba(255, 79, 163, .16); } }
  .phase { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .phase .t { font-weight: 800; font-size: 1rem; color: var(--lav); }
  .phase .weak { margin-left: auto; font-size: .74rem; color: var(--dim); }
  .phase .weak b { color: var(--prize); font-weight: 700; }
  .qtext { font-size: 1.12rem; line-height: 1.75; min-height: 3.5em; word-break: break-all; font-weight: 600; }
  .cursor { display: inline-block; width: .5em; height: 1.1em; vertical-align: -.15em; background: var(--lav); animation: blink .8s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .caption { min-height: 1.6em; font-weight: 700; }
  .caption.good { color: var(--lav); }
  .caption.bad { color: var(--foe); }
  .reveal-ans { font-size: .86rem; color: var(--dim); border-top: 1px solid var(--edge); padding-top: 6px; }
  .reveal-ans b { color: var(--ink); font-size: 1rem; }

  /* 仲間 */
  /* 下＝あなたたち：仲間4人と、共有体力・気力 */
  #b-party { display: flex; flex-direction: column; gap: 6px; }
  .mems { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .ours { display: flex; align-items: center; gap: 12px; padding: 6px 10px; background: var(--panel); border: 1px solid var(--edge); clip-path: var(--cut-s); }
  .ours .hpline { flex: 1; min-width: 0; }
  .mem { position: relative; padding: 6px 8px; background: var(--panel); border: 1px solid var(--edge); clip-path: var(--cut-s); min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .mem.you { border-color: var(--you-2); background: linear-gradient(180deg, rgba(139, 92, 246, .2), var(--panel)); }
  .mem.own { border-color: var(--lav); background-color: rgba(185, 164, 255, .14); }
  .mem.own .lv { color: var(--lav); }
  .mem .nm { font-weight: 800; font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
  /* 顔は名前の行だけに置く：縦390pxで4人が横に並ぶので、板の高さを増やさない */
  .mem .face { width: 26px; height: 26px; flex: none; }
  .mem .lv { font-family: var(--font-ui); font-weight: 700; font-size: .74rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .mem .lv.top { color: var(--prize); }
  .mem .bub { min-height: 1.4em; font-size: .74rem; font-weight: 700; color: var(--ink); line-height: 1.3; word-break: break-all; }
  .mem .bub.bad { color: var(--foe); }
  .mem .bub.good { color: var(--lav); }
  /* 回答中の人：clip-path が外への光を切るので、板そのものの明るさを脈打たせる */
  .mem.act { border-color: var(--prize); animation: memPulse 1s ease-in-out infinite; }
  @keyframes memPulse { 50% { background-color: rgba(255, 179, 218, .16); } }

  /* 操作 */
  /* ボタンは親指の下の同じ場所に1つ。縦持ちで中身が長くても画面の下に留める */
  .ctrl { display: flex; flex-direction: column; gap: 8px; position: sticky; bottom: max(8px, env(safe-area-inset-bottom)); z-index: 5; }
  .big small { display: block; font-size: .72rem; font-weight: 700; letter-spacing: 0; opacity: .8; }
  .big.idle { min-height: 92px; display: grid; place-items: center; padding: 10px 14px; text-align: center; font-size: .9rem; color: var(--dim); background: var(--panel); border: 1px dashed var(--edge); clip-path: var(--cut); }
  /* button.big に限る：前は予告の札の「大技」タグまで巨大なボタンの形になっていた */
  button.big { font-weight: 800; font-size: 1.15rem; padding: 14px; min-height: 56px; clip-path: var(--cut); }
  /* 主ボタン：1画面に1つ、強調色のベタ塗り */
  .big.go { background: var(--foe); border: 0; color: #1d0512; letter-spacing: .04em; }
  .big.go:disabled { background: rgba(255, 79, 163, .25); color: var(--ink); }
  .big.buzz { background: var(--foe); border: 0; color: #1d0512; min-height: 92px; font-size: 1.6rem; letter-spacing: .1em; }
  .big.buzz .kick { color: #4a0d2c; letter-spacing: .5em; font-size: .7rem; }
  /* 押せるまでの間：同じ場所・同じ大きさのまま、中が左から満ちていく（前は WAIT の別の箱に替わっていた） */
  .big.buzz.wait { background: linear-gradient(90deg, rgba(255, 79, 163, .38) var(--open, 0%), var(--panel) var(--open, 0%)); border: 1px solid var(--foe); color: var(--ink); }
  .big.wait .kick { color: var(--foe); }
  .big.insure { background: rgba(139, 92, 246, .3); border: 1px solid var(--you-2); color: var(--ink); min-height: 72px; }
  .hint { font-size: .8rem; color: var(--dim); text-align: center; }
  .hint.pick { color: var(--ink); font-size: .86rem; }
  .hint.pick b { color: var(--lav); }
  .ops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .ops button, .ops .info { display: flex; flex-direction: column; align-items: flex-start; gap: 0; padding: 8px 10px; text-align: left; line-height: 1.35; }
  .ops .info { border: 1px dashed var(--edge); clip-path: var(--cut-s); }
  .ops b { font-size: .92rem; }
  .ops span { font-size: .72rem; color: var(--dim); }
  .ops .cost { font-family: var(--font-ui); font-weight: 700; color: var(--lav); }
  .ops button:not(.off):not(:disabled) { border-color: rgba(185, 164, 255, .45); }
  .input { font-weight: 800; font-size: 1.45rem; letter-spacing: .14em; text-align: center; min-height: 1.6em; word-break: break-all; padding: 6px; background: var(--panel); clip-path: var(--cut-s); border-bottom: 2px solid var(--you-2); }
  .input .slot { color: rgba(185, 164, 255, .35); }
  .pad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .pad button { font-weight: 800; font-size: 1.7rem; padding: 12px 0; min-height: 64px; background: var(--panel-2); border-color: rgba(185, 164, 255, .4); }

  /* タイトル・報酬・結果 */
  .logo { text-align: center; padding: 18px 0 6px; }
  .logo .en { font-family: var(--font-logo); font-weight: 900; font-size: clamp(1.9rem, 9vw, 2.8rem); letter-spacing: .06em; line-height: 1.05;
    background: linear-gradient(90deg, var(--lav), var(--ink) 45%, var(--prize)); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none; filter: drop-shadow(2px 0 0 rgba(255, 79, 163, .55)) drop-shadow(-2px 0 0 rgba(139, 92, 246, .55)); }
  .logo h1 { font-size: 1rem; color: var(--dim); font-weight: 700; margin-top: 6px; letter-spacing: .12em; }
  .card { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .card h2 .kick { margin-bottom: 2px; }
  .genres { display: flex; flex-wrap: wrap; gap: 6px; }
  .genres button { padding: 6px 12px 6px 10px; min-height: 40px; font-size: .88rem; border-left: 3px solid var(--gc, var(--lav)); }
  .genres button.on { background: var(--you); border-color: var(--you); border-left-color: var(--gc, var(--lav)); color: #fff; font-weight: 800; }
  .choices { display: grid; gap: 8px; }
  .choices button { text-align: left; display: flex; flex-direction: column; gap: 2px; }
  .choices button.on { border-color: var(--you-2); background: rgba(139, 92, 246, .28); }
  .choices button.on b::before { content: "▸ "; color: var(--lav); }
  .choices b { font-weight: 800; }
  .choices span { font-size: .85rem; color: var(--dim); }
  .mates { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 6px; font-size: .85rem; }
  .mates div { padding: 8px 10px; border: 1px solid var(--edge); clip-path: var(--cut-s); background: rgba(255, 255, 255, .03); }
  .mates .star { color: var(--prize); }
  .mates div { display: flex; gap: 8px; align-items: center; }
  .mates .face { width: 44px; height: 44px; flex: none; }
  /* 誰で潜るか：縦390pxでも4人が1段に収まるように、顔を上・名前を下にした細い札にする */
  .crew { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }

  .crew .face { width: 56px; height: 56px; }
  .crew b { font-weight: 800; }

  .crew button.on b { color: var(--prize); }

  .mates p { margin: 0; }
  .deck { display: flex; flex-wrap: wrap; gap: 6px; }

  .deck .chip.owned { background: rgba(139, 92, 246, .22); }
  ul.rules { margin: 0; padding-left: 1.2em; font-size: .86rem; color: var(--dim); display: flex; flex-direction: column; gap: 4px; }

  .tbl { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .88rem; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--edge); text-align: right; font-variant-numeric: tabular-nums; }
  td:last-child { font-family: var(--font-ui); font-weight: 700; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  .result-head { text-align: center; padding: 10px 0 2px; }
  .result-head .en { font-family: var(--font-logo); font-weight: 900; font-size: clamp(2rem, 10vw, 3rem); letter-spacing: .06em; line-height: 1.1; }
  .result-head.win .en { color: var(--lav); text-shadow: 2px 0 0 rgba(255, 79, 163, .6), -2px 0 0 rgba(139, 92, 246, .7); }
  .result-head.lose .en { color: var(--foe); text-shadow: 2px 0 0 rgba(139, 92, 246, .6), -2px 0 0 rgba(255, 79, 163, .4); }
  .result-head h1 { font-size: 1.1rem; margin-top: 4px; }
  .result-head.stage-clear .en { font-size: clamp(1.4rem, 7vw, 2rem); color: var(--lav); }

  /* 動きの設定（3段）。窓口は calm() の1か所 */
  .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .seg button { padding: 6px 4px; font-size: .8rem; }
  .seg button.on { background: rgba(139, 92, 246, .32); border-color: var(--you-2); font-weight: 800; }

  /* 正答率の記録 */
  .stats td.q { text-align: left; font-family: inherit; font-weight: 400; white-space: normal; min-width: 12em; }
  .stats td.q small { color: var(--dim); }
  .stats th { white-space: nowrap; }
  .stats .low { color: var(--foe); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }

  /* 一番押してほしいボタン1つだけ：回る光の枠 */
  .cta { position: relative; padding: 2px; clip-path: var(--cut); background: rgba(255, 79, 163, .35); overflow: hidden; }
  .cta::before { content: ""; position: absolute; inset: -150%; background: conic-gradient(from 0deg, transparent 0 60%, var(--lav) 72%, var(--prize) 80%, transparent 92%); animation: spin 2.8s linear infinite; }
  .cta > button { position: relative; width: 100%; }
  .cta:has(button:disabled)::before { display: none; }
  @keyframes spin { to { transform: rotate(1turn); } }

  .guide { padding: 9px 12px; border-color: rgba(185, 164, 255, .35); display: flex; flex-direction: column; gap: 4px; font-size: .85rem; line-height: 1.55; }
  .field .guide { background: none; border: 0; clip-path: none; padding: 0; }
  .guide p { font-weight: 700; color: var(--ink); }
  .guide p.new { color: var(--prize); font-weight: 700; }
  .guide p.new::before { content: "NEW "; font-family: var(--font-ui); font-size: .66rem; letter-spacing: .2em; }
  .log { padding: 8px 12px; font-size: .82rem; }
  .log summary { cursor: pointer; color: var(--dim); font-weight: 700; min-height: 32px; display: flex; align-items: center; }
  .log ol { margin: 6px 0 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; -webkit-user-select: text; user-select: text; }
  .log li { padding-left: 8px; border-left: 2px solid var(--edge); }
  .log li.good { color: var(--lav); border-left-color: var(--you-2); }
  .log li.bad { color: var(--foe); border-left-color: var(--foe); }

  /* 押せない理由の札：時間で消さず、ほかに触れたら引っ込める */
  #why { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 8px); z-index: 60;
    max-width: min(420px, calc(100vw - 32px)); padding: 9px 14px; background: rgba(40, 12, 28, .96); border: 1px solid var(--foe);
    clip-path: var(--cut-s); font-size: .86rem; font-weight: 700; pointer-events: none; }
  #why[hidden] { display: none; }

  /* 手触りの演出：浮かぶ数字・大きな見出し・揺れ */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .fl { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-ui); font-weight: 800; font-size: 1.6rem; color: var(--ink); font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 0 var(--bg), 0 0 10px var(--bg); animation: fl-up 1.1s ease-out forwards; white-space: nowrap; }
  .fl.dmg { color: var(--prize); font-size: 2.3rem; text-shadow: 2px 0 0 rgba(139, 92, 246, .8), 0 2px 0 var(--bg), 0 0 12px var(--bg); }
  .fl.dmg.big { font-size: 3rem; }
  .fl.hurt { color: var(--foe); }
  .fl.heal { color: var(--lav); }

  .banner { --bc: var(--prize); position: absolute; left: 8px; right: 8px; top: 38%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; animation: bn 1.15s cubic-bezier(.2, .9, .3, 1) forwards; }
  .banner .kick { font-size: .72rem; letter-spacing: .6em; color: var(--bc); margin-right: -.6em; animation: kick 1.15s ease-out forwards; }
  .banner b { font-weight: 900; font-size: clamp(1.9rem, 9.5vw, 3rem); color: var(--ink); letter-spacing: .04em; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 3px 0 0 color-mix(in srgb, var(--bc) 75%, transparent), -2px 0 0 rgba(139, 92, 246, .55), 0 3px 0 var(--bg); }
  .banner small { font-weight: 700; font-size: .92rem; color: var(--ink); text-shadow: 0 1px 4px var(--bg); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .banner.neon { --bc: var(--lav); }
  .banner.red { --bc: var(--foe); }
  .banner.good { --bc: var(--you-2); }
  /* 斜めの帯：濃い地に、上下へ2色の細い線 */
  .banner::before { content: ""; position: absolute; left: 50%; top: 50%; width: 140vw; height: calc(100% + 2.6em); transform: translate(-50%, -50%) skewY(-3deg);  /* 前は 5.4em 固定で、上下の線が英字と小見出しを横切っていた */
    background: linear-gradient(90deg, transparent, rgba(3, 4, 10, .9) 18%, rgba(3, 4, 10, .9) 82%, transparent); z-index: -1;
    border-top: 2px solid color-mix(in srgb, var(--bc) 80%, transparent); border-bottom: 2px solid rgba(139, 92, 246, .6); }
  @keyframes bn { 0% { opacity: 0; transform: translateY(-50%) scale(1.5); } 14% { opacity: 1; transform: translateY(-50%) scale(1); } 80% { opacity: 1; transform: translateY(-50%) scale(1); } 100% { opacity: 0; transform: translateY(-50%) scale(.96); } }
  @keyframes kick { 0% { letter-spacing: 1.2em; opacity: 0; } 20% { letter-spacing: .6em; opacity: 1; } }
  .vignette { position: absolute; inset: 0; box-shadow: inset 0 0 90px 30px rgba(255, 79, 163, .5); animation: vg .6s ease-out forwards; }
  @keyframes vg { from { opacity: 1; } to { opacity: 0; } }
  .shake { animation: shake .38s; }
  @keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
  .queue.adv .qc { animation: adv .35s ease-out both; }
  .queue.adv .qc:last-child { animation: adv-in .45s ease-out both; }
  @keyframes adv { from { transform: translateX(calc(100% + 6px)); } to { transform: none; } }
  @keyframes adv-in { from { transform: translateX(60%); opacity: 0; } to { transform: none; opacity: 1; } }
  .flash { animation: flash .5s; }
  @keyframes flash { from { background-color: rgba(255, 179, 218, .28); } }

  /* 動きを減らす：回る・揺れる・滑り込む動きを止めて最後の形をすぐ出す（窓口は calm()） */
  html[data-calm] .cursor, html[data-calm] .flash, html[data-calm] .shake, html[data-calm] .queue.adv .qc,
  html[data-calm] .mem.act, html[data-calm] .fcard, html[data-calm] .cta::before, html[data-calm] .fl, html[data-calm] .banner, html[data-calm] .banner .kick { animation: none; }
  html[data-calm] .cta::before { display: none; }
  html[data-calm] #fx { display: none; }

  /* 戦闘画面は2つの列に分けておき、縦持ちでは中身を1列に並べ直す */
  .col { display: contents; }
  #b-top { order: 1; } #b-queue { order: 2; } #b-stage { order: 3; } #b-party { order: 4; } #b-ctrl { order: 5; } #b-log { order: 6; }

  /* 横持ちスマホ（高さ500px以下）：縦に積むと押すボタンが画面の外に出るので、左に盤面の情報・右に問題と操作の2列にする */
  @media (orientation: landscape) and (max-height: 520px) {

    #app.battle .col { display: flex; flex-direction: column; gap: 8px; max-height: 100%; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 8px; scrollbar-width: none; }

    .qtext { min-height: 2.4em; font-size: 1.02rem; line-height: 1.6; }
    .big.buzz, .big.wait, .big.idle { min-height: 76px; }
    .field { min-height: 0; flex: 1; }
    /* 横持ちは高さが足りず、技が4つあると「やめる」が下のボタンに潜っていた。説明を2行までに詰める */
    .field { padding: 9px 12px; gap: 5px; }
    .field .ops button { padding: 5px 9px; min-height: 40px; }
    .field .ops span { font-size: .66rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .field .hint.pick { font-size: .8rem; }
    #app.battle .col:last-child { padding-bottom: 0; }
    .pad button { min-height: 52px; padding: 8px 0; font-size: 1.45rem; }
    .banner { top: 50%; }
  }
  /* iPhone の Safari は合成メモリが小さいので、演出の最中は backdrop-filter や大きなぼかしを使わない（この画面では使っていない） */
</style>

// 問いがわかる位置（文字の番号）。疑問の語があればそこ、なければ「〜は？」の直前の名詞のはじめ
function askAt(text) {
  const t = [...text], n = t.length;
  const s = t.join('');
  const W = /(何|誰|どこ|いつ|どの|どれ|どう|いくつ|なぜ|どんな|どちら)/g;
  let at = -1, m;
  while ((m = W.exec(s))) at = [...s.slice(0, m.index)].length;
  if (at < 0) {
    let i = n - 1;
    while (i > 0 && /[？?」』]/.test(t[i])) i--;
    if (t[i] === 'は' || t[i] === 'を' || t[i] === 'と') i--;
    const noun = /[\p{Script=Han}\p{Script=Katakana}ー0-9０-９A-Za-zＡ-Ｚ]/u;
    while (i > 0 && noun.test(t[i - 1])) i--;
    at = i;
  }
  return Math.max(Math.floor(n * 0.4), Math.min(at, n - 1));
}

function rollKnowledge(m, q) {
  const L = lvOf(m, q.g);
  const p = clamp(0.12 + 0.08 * L - (q.m ? 0.18 : 0) + (m.player ? 0.04 : 0), 0.05, 0.9);
  const knows = rnd() < p;
  // react：押せるようになってから押すまでの時間（ms）。知らなければ押さない（お調子者はたまに当てずっぽう）
  let react = null;
  if (knows) react = clamp(1500 - 110 * L - 80 * (m.bias || 0) + (rnd() - 0.5) * 500, 150, 2600);
  else if (m.jolly && rnd() < 0.2) react = 1200 + rnd() * 1500;
  return { knows, react };
}

function enemyDeck(e) {
  const cards = [];
  for (const g of e.gs) for (let i = 0; i < 2; i++) cards.push(mkCard(g, { src: 'enemy', m: rnd() < e.mania, bossLock: !!e.boss }));
  for (let i = 0; i < e.bigs; i++) cards.push(mkCard(pick(e.gs), { src: 'enemy', big: true, m: rnd() < e.mania, bossLock: !!e.boss }));
  return shuffle(cards);
}
// 敵の山とダンジョンの出題表から半分ずつ引く
function draw() {
  const fromTable = rnd() < 0.5;
  if (fromTable) {
    if (!G.tablePile.length) G.tablePile = shuffle(G.table.map(c => ({ ...c, id: ++cardSeq, src: 'table' })));
    return G.tablePile.pop();
  }
  if (!G.enemy.pile.length) G.enemy.pile = enemyDeck(G.enemy);
  return G.enemy.pile.pop();
}
const sightN = () => G.skills.sight ? 5 : 3;
// コンボ：同じジャンルを続けて正解すると、2問目 1.5倍・3問目から 2倍。G.combo は直前までの連続（ジャンルと数）
const comboMul = n => n >= 3 ? 2 : n === 2 ? 1.5 : 1;
const comboNext = g => G.combo.g === g ? G.combo.n + 1 : 1;
// 予告の列の各札が、前の札をすべて正解したときに何コンボ目になるか
function comboPlan() {
  let { g, n } = G.combo;
  // 出題中は、場の札を正解した前提で数える
  if (G.card && ['preview', 'reveal', 'insure', 'answer'].includes(G.qphase)) { n = comboNext(G.card.g); g = G.card.g; }
  return G.queue.map(c => { n = c.g === g ? n + 1 : 1; g = c.g; return n; });
}
function fillQueue() { while (G.queue.length < sightN()) G.queue.push(draw()); }

const parts = {};
function render() {
  applyCalm();
  if (G && G.screen === 'battle') {
    if (lastHtml !== 'battle') {
      app.innerHTML = '<div class="col"><div id="b-top" class="top"></div><div id="b-queue"></div><div id="b-party"></div><div id="b-log"></div></div><div class="col"><div id="b-stage"></div><div id="b-ctrl" class="ctrl"></div></div>';
      app.classList.add('battle');
      // 前は下の「潜る」を押すとスクロール位置が残り、体力と予告の列が画面の上に隠れていた
      scrollTo(0, 0);
      lastHtml = 'battle'; for (const k in parts) delete parts[k];
    }
    const v = battleView();
    for (const k of Object.keys(v)) if (parts[k] !== v[k]) { document.getElementById('b-' + k).innerHTML = v[k]; parts[k] = v[k]; }
    const bar = document.getElementById('timebar');
    if (bar) { const ph = G.ph || { t: 0, dur: 1 }; bar.style.width = clamp(100 - 100 * ph.t / ph.dur, 0, 100) + '%'; }
    const st = document.querySelector('#b-stage .stage');
    if (st) st.classList.toggle('flash', !!G.hitFlash);
    return;
  }
  const html = !G ? (statsUI.open ? statsView() : titleView()) : G.screen === 'reward' ? rewardView() : endView();
  if (html !== lastHtml) {
    const sameScreen = lastHtml && html.slice(0, 120) === lastHtml.slice(0, 120);
    app.innerHTML = html; lastHtml = html; app.classList.remove('battle');
    if (!sameScreen) scrollTo(0, 0);
  }
}

// 敵の手札の札：外したときの被弾をいちばん大きく、担当は右下の顔（いなければ「?」）
function queueCard(c, i) {
  const own = owners(c.g);
  const pos = i === 0 ? 'いま' : i === 1 ? '次' : i === 2 ? 'その次' : `${i + 1}問目`;
  const sel = G.sel.includes(i);
  // 倍率は答える前にここで全部見える（早押しだけは押した時に決まる）
  const n = opened('combo') ? comboPlan()[i] : 1;
  const tags = [c.big ? '<span class="tag t-big">大技</span>' : '', c.hard ? '<span class="tag t-hard">難化×2</span>' : '',
    G.enemy.weak === c.g ? '<span class="tag t-weak">★弱点×1.5</span>' : '', n >= 2 ? `<span class="tag t-combo">コンボ×${comboMul(n)}</span>` : ''].join('');
  return `<button class="qc ${i === 0 ? 'now' : ''} ${locked(c) ? 'lock' : ''} ${sel ? 'sel' : ''} ${n >= 2 ? 'combo' : ''} ${c.m ? 'mania' : ''}" data-act="sel" data-v="${i}" data-g="${c.g}" ${G.qphase === 'plan' ? '' : 'tabindex="-1"'}
    aria-label="${pos}：${GENRES[c.g]}、${c.m ? 'マニアック' : 'ふつう'}、外すと${cardAtk(c)}、${own.length ? '担当 ' + own.map(m => m.name).join('・') : '担当なし'}">
    <span class="pos">${pos}${locked(c) ? ' 🔒' : ''}</span>
    <span class="g">${GENRES[c.g]}</span>
    <span class="m">${c.m ? `マニアック${c.hard ? '' : ' <b>×1.5</b>'}` : 'ふつう'}</span>
    <span class="x">${tags}</span>
    <span class="hit"><small>外すと</small><em>-${cardAtk(c)}</em></span>
    <span class="own">${own.length ? own.map(m => face(m)).join('') : '<i>?</i>'}</span>
  </button>`;
}

// 場（作戦中）：何も選んでいなければ指さしの一言、札を選んだらその札にできることだけ
function planField() {
  const head = `<div class="phase"><span class="kick">FIELD</span><span class="t">作戦</span><span class="sub">ここに出た札が問題になる</span></div>`;
  const hold = G.hold ? `<button data-act="skill" data-v="keep"><b>差し込む</b><span>取り置いた札を列の先頭に入れる</span></button>` : '';
  if (!G.sel.length) return `<div class="stage field">${head}${guide()}${hold ? `<div class="ops">${hold}</div>` : ''}</div>`;
  const i = G.sel[0], card = G.queue[i], lk = locked(card);
  const pos = i === 0 ? '「いま」' : i === 1 ? '「次」' : i === 2 ? '「その次」' : `${i + 1}問目`;
  const LOCKED = '🔒の札（大技・ボスの札）は動かせない';
  const ops = opened('redraw') ? [opBtn('redraw', '引き直す', COST.redraw, 'この札を捨てて、新しく引く', !lk, LOCKED)] : [];
  for (const k of Object.keys(G.skills)) {
    const sk = SKILLS[k];
    if (sk.passive || (k === 'keep' && G.hold)) continue;
    let ok = !lk, why = LOCKED, desc = sk.desc;
    if (k === 'convert') {
      if (ok && player().fav.includes(card.g)) { ok = false; why = 'この札はもうあなたの得意ジャンル'; }
      desc = `この札を${GENRES[player().fav[0]]}に書き換える`;
    }
    if (k === 'level') desc = card.m ? 'この札をふつうに戻す' : 'マニアックにする（難化：正解で2倍、外すと被弾1.3倍）';
    if (k === 'keep' && ok && G.keptThisBattle) { ok = false; why = 'とっておきは1戦に1回まで'; }
    ops.push(opBtn('skill" data-v="' + k, sk.name, sk.cost, desc, ok, why));
  }
  const swapHint = lk ? 'この札は動かせない' : `ほかの札をタップで入れ替え（気力${COST.swap}）`;
  return `<div class="stage field">${head}
    <p class="hint pick"><b>${pos}の${GENRES[card.g]}</b>：${swapHint}</p>
    <div class="ops">${ops.join('')}${hold}<button data-act="unsel"><b>やめる</b><span>選ぶ前に戻る</span></button></div></div>`;
}
// 場（出題中）：先頭の札が場に出て裏返り、その札に問題文が出る。正解なら敵へ、外れなら下へ
function questionField() {
  const q = G.q, ph = G.ph || { label: '', dur: 1, t: 0 }, card = G.card;
  const len = q ? [...q.text].length : 0;
  const showQ = q && G.qphase !== 'preview';
  const shownText = q ? [...q.text].slice(0, G.shown).join('') : '';
  const fate = G.qphase === 'done' ? (G.qs && G.qs.ok ? 'won' : 'lost') : G.qphase === 'preview' ? 'flip' : '';
  const combo = opened('combo') && G.combo.n >= 2 ? `<span class="chip combo" data-g="${G.combo.g}">${GENRES[G.combo.g]} <b>${G.combo.n}</b> 連続</span>` : '';
  return `<div class="stage field q">
    <div class="phase"><span class="kick">FIELD</span><span class="t">${esc(ph.label)}</span></div>
    <div class="fcard ${fate} ${card && locked(card) ? 'lock' : ''}" ${q ? `data-g="${q.g}"` : ''}>
      <div class="fhead">${q ? chip(q.g) + (card && card.m ? `<span class="chip mania">${card && card.hard ? '難化 ×2' : 'マニアック ×1.5'}</span>` : '') : ''}${card ? `<span class="fhit">外すと <em>-${cardAtk(card)}</em></span>` : ''}</div>
      <div class="bar time"><i id="timebar"></i></div>
      <div class="qtext">${showQ ? esc(shownText) + (G.shown < len && G.qphase === 'reveal' ? '<span class="cursor"></span>' : '') : '<span class="back">?</span>'}</div>
      ${G.showAns && q ? `<div class="reveal-ans">答え：<b>${esc(q.disp)}</b>（${esc(q.a)}）${q.note ? '　' + esc(q.note) : ''}</div>` : ''}
    </div>
    <div class="caption ${G.cap.cls}">${esc(G.cap.text)}</div>
    <div class="fmeta">${showQ ? rateChip() : ''}${combo}</div>

}

function opBtn(act, name, cost, desc, ok, why) {
  const reason = !ok ? why : G.ki < cost ? `気力が足りない（気力${cost}が要る、いまは${G.ki}）` : '';
  return `<button data-act="${act}" ${reason ? `class="off" aria-disabled="true" data-why="${esc(reason)}"` : ''}><b>${name}</b><span><span class="cost">気力${cost}</span> ${desc}</span></button>`;
}
// ボタンはいつも同じ場所に1つ。作戦は「この順で出す」、出題は「押す！」、保険の間は「保険に入る」
function controls() {
  const c = G.ctrl;
  if (c === 'plan') return `<div class="cta"><button class="big go" data-act="go">この順で出す</button></div>`;
  if (c === 'wait') {
    // 同じ場所・同じ大きさで、押せるようになるまで中が満ちていく
    const mine = owners(G.q.g).includes(player());
    return `<button class="big buzz wait" data-act="buzz" aria-disabled="true" style="--open:${Math.round((G.open || 0) * 100)}%"><span class="kick">${mine ? 'YOUR TURN' : 'READY'}</span>${mine ? 'あなたの出番' : owners(G.q.g).length ? esc(G.lockText || '') : '問いを待つ'}<small>問いが出たら押せる${owners(G.q.g).length && !mine ? '（担当が少し先）' : ''}</small></button>`;
  }
  if (c === 'buzz') return `<button class="big buzz" data-act="buzz"><span class="kick">BUZZ</span>押す！</button>`;
  if (c === 'insure') return `<button class="big insure" data-act="buzz">保険に入る<small>前の人が外したら、あなたが答える</small></button>`;
  if (c === 'panel') {
    const p = G.panel, a = p.targets[0] || [...G.q.a];
    const slots = a.map((ch, i) => i < p.input.length ? esc(p.input[i]) : '<span class="slot">○</span>').join('');
    return `<div class="input">${slots}</div><div class="pad">${p.cands.map(ch => `<button data-act="char" data-v="${esc(ch)}">${esc(ch)}</button>`).join('')}</div>`;
  }
  // 見ているだけの間も、ボタンと同じ大きさの枠を残して位置を動かさない
  return `<div class="big idle">${esc(c === 'watch' ? G.watchText || '' : '')}</div>`;
}

function deckView() {
  const n = {};
  for (const c of G.table) n[c.g] = (n[c.g] || 0) + 1;
  return `<div class="deck">${Object.keys(GENRES).filter(g => n[g]).map(g => `<span class="chip ${owners(g).length ? 'owned' : ''}" data-g="${g}">${GENRES[g]} <b>×${n[g]}</b></span>`).join('')}</div>`;
}
function rewardView() {
  const n = {};
  for (const c of G.table) n[c.g] = (n[c.g] || 0) + 1;
  const back = `<div class="ops"><button data-act="back"><b>戻る</b><span>報酬の種類を選び直す</span></button></div>`;
  const st = G.rewardStep;
  if (st === 'add') {
    return `<div class="result-head stage-clear"><div class="en">ADD</div><h1>札を足す</h1></div><p class="muted">出題表に足すジャンルを選んでください。2枚足します。担当がいるジャンルだけ選べます。</p>
      <div class="genres">${ownedGenres().map(g => `<button data-act="reward" data-v="${g}" data-g="${g}">${GENRES[g]}（担当 ${owners(g).map(m => m.name).join('・')}）×${n[g] || 0}</button>`).join('')}</div>${back}`;

let lastFast = 0;
function onAct(b) {
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'me') { setup.me = v; render(); return; }
  if (act === 'motion') { motionPref = v; try { localStorage.setItem(MOTION_KEY, v); } catch {} lastHtml = ''; render(); return; }
  if (act === 'start') { startRun(); return; }
  if (act === 'stats' || act === 'statsback') { statsUI.open = act === 'stats'; render(); return; }
  if (act === 'statsg') { statsUI.g = v; render(); return; }
  if (act === 'statscsv' || act === 'statsjson') { exportStats(act === 'statscsv' ? 'csv' : 'json'); return; }
  if (act === 'statsclear') { if (confirm('正答率の記録をすべて消します。よろしいですか？')) { qstats = {}; saveStats(); render(); } return; }
  if (act === 'again') { G = null; lastHtml = ''; render(); return; }
  if (act === 'sel') {
    if (G) G.queueAnim = false;
    if (!G || G.qphase !== 'plan') return;
    const i = +v, a = G.sel[0];
    if (a === i) G.sel = [];
    else if (a == null) G.sel = [i];
    else {
      // 2枚目をタップ：入れ替えられるならすぐ入れ替え、だめなら理由を出して選び直す
      const why = [G.queue[a], G.queue[i]].some(locked) ? '🔒の札（大技・ボスの札）は入れ替えられない'
        : G.ki < COST.swap ? `気力が足りない（入れ替えに気力${COST.swap}が要る、いまは${G.ki}）` : '';
      if (why) { showWhy(why); G.sel = [i]; }
      else { G.sel = [a, i]; doOp('swap'); }
    }
    render(); return;
  }
  if (act === 'unsel') { if (G) { G.sel = []; render(); } return; }
  if (act === 'char') { panelPick(v); return; }
  pending.push({ type: act, v });
}

app.addEventListener('toggle', e => { if (G && e.target.matches('details.log')) { G.logOpen = e.target.open; } }, true);

function showWhy(text) { whyEl.textContent = text; whyEl.hidden = false; }
document.addEventListener('pointerdown', e => { if (!e.target.closest('.off')) whyEl.hidden = true; }, true);
app.addEventListener('pointerdown', e => {

function panelPick(ch) {
  const p = G.panel;
  if (!p || p.done) return;
  const i = p.input.length;
  p.input.push(ch);
  p.targets = p.targets.filter(t => t[i] === ch);
  if (!p.targets.length) { p.done = true; p.ok = false; }
  else if (p.targets.some(t => t.length === p.input.length)) { p.done = true; p.ok = true; }
  else p.cands = panelCands(p);
  render();
}
const HIRA = ['ー', ...'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽゃゅょっ'];
const VARIANTS = ['かが', 'きぎ', 'くぐ', 'けげ', 'こご', 'さざ', 'しじ', 'すず', 'せぜ', 'そぞ', 'ただ', 'ちぢ', 'つづっ', 'てで', 'とど', 'はばぱ', 'ひびぴ', 'ふぶぷ', 'へべぺ', 'ほぼぽ', 'やゃ', 'ゆゅ', 'よょ', 'あぁ', 'いぃ', 'うぅゔ', 'えぇ', 'おぉ'];
function panelCands(p) {
  const i = p.input.length;
  const right = [...new Set(p.targets.map(t => t[i]))];
  const out = new Set(right.slice(0, 3));
  for (const w of shuffle(G.q.wrong || [])) { const c = [...w][i]; if (c && out.size < 4) out.add(c); }
  const v = VARIANTS.find(s => s.includes(right[0]));
  if (v && out.size < 4) out.add(pick([...v].filter(x => x !== right[0])));
  while (out.size < 4) out.add(pick(HIRA));
  return shuffle([...out]);
}

// ===== 進行 =====
function startRun() {
  loadShared();
  const me = crewOf(setup.me);
  // 得意2つはキャラごとに決まっている。あなたが動かすときは2つとも担当になる
  const fav = favOf(me);
  const you = { id: me.id, name: me.name, persona: me.persona, player: true, bias: 1, fav, lv: { ...me.lv, ...Object.fromEntries(fav.map(g => [g, Math.max(OWNER_LV, me.lv[g])])) } };
  G = {
    screen: 'battle', party: [you, ...CREW.filter(m => m.id !== me.id).map(m => ({ ...m, lv: { ...m.lv } }))],
    hp: 100, maxHp: 100, bi: 0, enemy: null, q: null, shown: 0, bub: {}, cap: { text: '', cls: '' },
    ph: null, ctrl: null, qphase: null, logOpen: false, sel: [], queue: [], hold: null, ki: KI_MAX,
    table: Object.keys(GENRES).map(g => mkCard(g)), tablePile: [],
    skills: {}, solved: new Set(), used: new Set(), combo: { g: null, n: 0 },
    highlights: [], log: [], plans: 0, bplans: 0,
    stat: { q: 0, ok: 0, owned: 0, ownerOk: 0, quick: 0, insured: 0, swap: 0, redraw: 0, skill: 0, combo: 0 },
  };
  pending = [];
  runGame().catch(err => { console.error(err); caption('エラー：' + err.message, 'bad'); render(); window.__ERROR = err.message; });
}

async function runGame() {
  for (G.bi = 0; G.bi < ENEMIES.length; G.bi++) {
    const d = ENEMIES[G.bi];
    G.enemy = { ...d, maxHp: d.hp, pile: [] };
    G.enemy.pile = enemyDeck(G.enemy);
    G.tablePile = shuffle(G.table.map(c => ({ ...c, id: ++cardSeq, src: 'table' })));
    G.queue = []; G.hold = null; G.keptThisBattle = false; G.combo = { g: null, n: 0 }; G.ki = KI_MAX; G.bplans = 0;
    fillQueue();
    G.screen = 'battle'; G.q = null; G.bub = {};
    caption(`${d.name}が現れた`);
    render(); banner(d.name, d.boss ? 'ボス戦' : `${G.bi + 1}体目が現れた`, d.boss ? 'red' : 'neon');
    logEv(`■ ${d.name}が現れた。体力${d.hp}、出してくるジャンルは${d.gs.length > 5 ? '全部' : d.gs.map(g => GENRES[g]).join('・')}。気力が${KI_MAX}に戻った`);
    const fresh = NEWS[G.bi];
    if (fresh) logEv(`★ この戦闘から：${fresh}`);
    while (G.enemy.hp > 0 && G.hp > 0) await playQuestion();
    if (G.enemy.hp <= 0) { banner('撃破', d.name, 'good'); await pause(1000); }
    if (G.hp <= 0) break;
    if (G.bi < ENEMIES.length - 1) await reward();
  }
  G.clear = G.hp > 0;
  banner(G.clear ? '踏破' : '全滅', '', G.clear ? 'good' : 'red');
  G.screen = 'end'; G.ctrl = null; render();
  window.__RESULT = { clear: G.clear, bi: G.bi, hp: G.hp, stat: G.stat, table: G.table.length };
}

function pickQuestion(g, m) {
  // まだ正解していない問題を優先し、その中でも出していないものを先に
  const all = QUESTIONS.filter(q => q.g === g);
  const tiers = [
    all.filter(q => q.m === m && !G.solved.has(q.id) && !G.used.has(q.id)),
    all.filter(q => !G.solved.has(q.id) && !G.used.has(q.id)),
    all.filter(q => !G.used.has(q.id)),
    all,
  ];
  const q = pick(tiers.find(t => t.length));
  G.used.add(q.id);
  return q;
}

// 作戦タイム：予告の列をいじる
async function plan() {
  G.plans++; G.bplans++;
  G.qphase = 'plan'; G.q = null; G.sel = []; G.showAns = false; G.bub = {};
  setPhase('plan', '作戦タイム', 1);
  if (AUTO) { autoPlan(); return; }
  G.ctrl = 'plan';
  pending = [];
  for (;;) {
    const p = pending.shift();
    if (p) {
      if (p.type === 'go') break;
      doOp(p.type, p.v);
    }
    await step();
  }
  G.sel = [];
}
function doOp(type, v) {
  G.queueAnim = false;
  const s = G.sel.map(i => G.queue[i]);
  const pay = n => { if (G.ki < n) return false; G.ki -= n; return true; };
  if (type === 'swap' && s.length === 2 && !s.some(locked) && pay(COST.swap)) {
    const [a, b] = G.sel; [G.queue[a], G.queue[b]] = [G.queue[b], G.queue[a]];
    G.stat.swap++; caption('入れ替えた'); logEv(`入れ替え：${GENRES[G.queue[a].g]}と${GENRES[G.queue[b].g]}の順番を替えた（気力-1）`);
  } else if (type === 'redraw' && s.length === 1 && !locked(s[0]) && pay(COST.redraw)) {
    G.queue[G.sel[0]] = draw();
    G.stat.redraw++; caption(`${GENRES[s[0].g]}の札を捨てて、${GENRES[G.queue[G.sel[0]].g]}を引いた`); logEv(`引き直し：${GENRES[s[0].g]}を捨てて${GENRES[G.queue[G.sel[0]].g]}を引いた（気力-2）`);
  } else if (type === 'skill') {
    const sk = SKILLS[v];
    if (v === 'keep' && G.hold) { G.queue.unshift(G.hold); G.hold = null; G.queue.length = Math.min(G.queue.length, sightN() + 1); caption('取り置いた札を先頭に差し込んだ'); G.sel = []; return; }
    if (!sk || G.ki < sk.cost) return;
    let done = false;
    const c = s[0];
    if (v === 'convert' && s.length === 1 && !locked(c) && !player().fav.includes(c.g)) {
      const to = player().fav[0];
      c.g = to; done = true; caption(`札を${GENRES[to]}に書き換えた`);
    }
    if (v === 'level' && s.length === 1 && !locked(c)) {
      if (c.m) { c.m = false; c.hard = false; caption('札をふつうにした'); }
      else { c.m = true; c.hard = true; caption('札をマニアックにした（難化）'); }
      done = true;
    }
    if (v === 'keep' && s.length === 1 && !locked(c) && !G.keptThisBattle) {
      G.hold = c; G.queue.splice(G.sel[0], 1); fillQueue(); G.keptThisBattle = true; done = true; caption('札を取り置いた');
    }
    if (done) { G.ki -= sk.cost; G.stat.skill++; logEv(`技「${sk.name}」：${G.cap.text}（気力-${sk.cost}）`); }
  }
  G.sel = [];
}
// 自動プレイ用：担当のいない札を引き直し、宗旨替えがあれば使う
function autoPlan() {
  if (/noplan/.test(location.hash)) return;
  for (let i = 0; i < G.queue.length; i++) {
    const c = G.queue[i];
    if (locked(c) || owners(c.g).length) continue;
    if (G.skills.convert && G.ki >= 2) { G.sel = [i]; doOp('skill', 'convert'); }
    else if (G.ki >= 2 && opened('redraw')) { G.sel = [i]; doOp('redraw'); }
    else if (i === 0 && G.ki >= COST.swap) {
      // 1戦目は入れ替えだけ：担当のいる札を「いま」に持ってくる
      const j = G.queue.findIndex((x, k) => k > 0 && !locked(x) && owners(x.g).length);
      if (j > 0) { G.sel = [0, j]; doOp('swap'); }
    }
  }
}

async function playQuestion() {
  await plan();
  // 先頭の札が手札から場へ出る
  const card = G.queue.shift();
  G.queueAnim = true;
  fillQueue();
  const q = pickQuestion(card.g, card.m);
  // 出題した時点の正解率を出す（この問題で答えた分は次に出たときから反映）
  G.qrate = shared[q.id]?.[0] ? { who: 'みんな', t: shared[q.id][0], o: shared[q.id][1] }
    : qstats[q.id]?.[1] ? { who: 'あなた', t: qstats[q.id][1], o: qstats[q.id][2] } : null;
  noteStat(q.id, 0);
  G.q = q; G.card = card; G.shown = 0; G.bub = {}; G.active = null; G.showAns = false; G.ctrl = 'watch';
  pending = [];
  const own = owners(q.g);
  const qs = { first: null, by: null, ok: false };
  G.qs = qs;
  for (const m of G.party) m.k = rollKnowledge(m, q);
  G.qphase = 'preview';
  setPhase('preview', `${GENRES[q.g]}・${q.m ? 'マニアック' : 'ふつう'}`, PREVIEW_MS);
  for (const m of own) say(m, m.player ? 'あなたの出番！' : pick(['ここは任せろ！', '出番だな', '待ってました']));
  render();
  if (own.length) banner(`${own.map(m => m.name).join('・')}の出番`, `${GENRES[q.g]}${q.m ? '・マニアック' : ''}`, 'neon');
  else banner('フリー問題', `${GENRES[q.g]}${q.m ? '・マニアック' : ''}　担当なし`, '');
  caption(own.length ? `${own.map(m => m.name).join('・')}の出番！` : 'フリー問題：誰でも押せる', own.length ? 'good' : '');
  logEv(`▶ 第${G.stat.q + 1}問：「いま」の札（${GENRES[card.g]}・${card.m ? 'マニアック' : 'ふつう'}${card.big ? '・大技' : ''}）が出題。${own.length ? `担当の${own.map(m => m.name).join('・')}が問いの直後に先に押せる` : '担当なし、誰でも押せる'}`);
  G.watchText = card.big ? `大技：外すと全員に${cardAtk(card)}ダメージ` : `外すと全員に${cardAtk(card)}ダメージ`;
  await pause(PREVIEW_MS);

  await flow(q, own);
  saveStats();

  G.showAns = true; G.shown = [...q.text].length; G.ctrl = null; G.active = null;
  G.stat.q++;
  if (own.length) G.stat.owned++;
  if (qs.ok) {
    G.stat.ok++;
    G.solved.add(q.id);
  } else {
    const d = cardAtk(card);
    G.hp = Math.max(0, G.hp - d);
    render(); floatText('#b-party .ours .bar', `-${d}`, 'hurt'); hurtFx();
    if (card.big) banner('大技', `共有体力 -${d}`, 'red');
    caption(`${G.enemy.name}の攻撃！ 共有体力 -${d}`, 'bad');
    logEv(`× 誰も取れず、${G.enemy.name}の${card.big ? '大技' : '攻撃'}で共有体力 -${d}${opened('combo') && G.combo.n >= 2 ? '（コンボも途切れた）' : ''}`, 'bad');
    G.combo = { g: null, n: 0 };
  }
  G.qphase = 'done';
  setPhase('result', qs.ok ? '正解' : '失敗', 2400);
  await pause(2400);
}

// 倍率は4つだけ：早押し・弱点・難化・コンボ。早押し以外は答える前に予告の札に出ている
function damageFor(m, q, o) {
  const L = lvOf(m, q.g);
  const base = Math.round(6 + 1.5 * L);
  let d = base, tags = [], parts = [`${m.name}の${GENRES[q.g]}Lv${L}で基本${base}`];
  const mul = (x, label) => { d *= x; tags.push(label); parts.push(`${label}×${x}`); };
  if (o.first && o.quick) mul(1.5, '早押し');
  if (G.enemy.weak === q.g) mul(1.5, '弱点');
  // 難しさ：技で難化した札は2倍、もともとマニアックの札は1.5倍（被弾が1.3倍になる分の見返り）
  if (G.card.hard) mul(2, '難化');
  else if (G.card.m) mul(1.5, 'マニアック');
  const n = comboNext(q.g);
  if (opened('combo') && n >= 2) { mul(comboMul(n), `コンボ${n}`); G.stat.combo++; }
  G.combo = { g: q.g, n };
  return { d: Math.round(d), tags, parts, n };
}
function hit(m, q, o) {
  const { d, tags, parts, n } = damageFor(m, q, o);
  G.enemy.hp = Math.max(0, G.enemy.hp - d);
  G.hitFlash = true; setTimeout(() => { if (G) G.hitFlash = false; }, 500);
  render();
  floatText('#b-top .hpline .bar.foe', `-${d}`, 'dmg' + (d >= 20 ? ' big' : ''));
  if (tags.includes('早押し')) banner('早押し', `${m.name} ${d}ダメージ`);
  else if (opened('combo') && n >= 2) banner('コンボ', `${GENRES[q.g]} ${n}問目　${d}ダメージ`);
  else banner('正解', `${m.name} ${d}ダメージ`, 'good');
  caption(`${m.name}の正解！ ${G.enemy.name}に${d}ダメージ`, 'good');
  logEv(`○ ${m.name}が正解：${parts.join(' ')} ＝ ${d}ダメージ`, 'good');
  say(m, '正解！', 'good');
  if (opened('combo') && n === 3) G.highlights.push(`${GENRES[q.g]}で3コンボ（${m.name}）`);
  if (!o.first) G.highlights.push(`${m.name}が保険で取り返した`);
  if (o.first && o.quick) G.highlights.push(`${m.name}が問いが出た直後に押して正解`);
}
function miss(m) {
  G.hp = Math.max(0, G.hp - MISS_COST);
  render(); floatText('#b-party .ours .bar', `-${MISS_COST}`, 'hurt');
  say(m, '外した…', 'bad');
  caption(`${m.name}の誤答。共有体力 -${MISS_COST}`, 'bad');
  logEv(`× ${m.name}が誤答（お手つきで共有体力 -${MISS_COST}）`, 'bad');
}

async function reveal(label, openMs) {
  const q = G.q, len = [...q.text].length, total = len * CHAR_MS + GRACE_MS;
  G.qphase = 'reveal';
  setPhase('reveal', label, total);
  const you = player();
  for (let t = 0; t < total; t += STEP) {
    G.shown = Math.min(len, Math.floor(t / CHAR_MS) + 1);
    const res = (m) => ({ m, frac: G.shown / len, quick: t - openMs(m) <= QUICK_MS });
    // あなたのボタン：開くまでは中が満ちていく（G.open は 0〜1）
    if (!AUTO) { G.open = clamp(t / openMs(you), 0, 1); G.ctrl = t >= openMs(you) ? 'buzz' : 'wait'; }
    if (!AUTO && t >= openMs(you) && take('buzz')) return res(you);
    if (!AUTO && t < openMs(you)) take('buzz');  // 開く前の押しは捨てる（ためておかない）
    const at = m => openMs(m) + m.k.react;
    const cpu = G.party.filter(m => cpuControlled(m) && m.k.react != null && t >= at(m)).sort((a, b) => at(a) - at(b))[0];
    if (cpu) return res(cpu);
    await step();
  }
  return null;
}
async function answer(m) {
  const q = G.q, a = [...q.a];
  G.active = m; G.qphase = 'answer';
  setPhase('answer', `${m.name}が回答中`, 4000 + a.length * 1500);
  if (m.player && !AUTO) {
    G.panel = { input: [], targets: [a, ...(q.alt || []).map(x => [...x])], done: false, ok: false };
    G.panel.cands = panelCands(G.panel);
    G.ctrl = 'panel';
    say(m, '回答中');
    for (let t = 0; t < G.ph.dur && !G.panel.done; t += STEP) await step();
    const ok = G.panel.done && G.panel.ok;
    G.panel = null; G.ctrl = 'watch'; G.watchText = '';
    return ok;
  }
  G.ctrl = 'watch'; G.watchText = `${m.name}が文字パネルで入力しています`;
  const ok = m.k.knows ? rnd() < 0.95 : rnd() < 0.08;
  const failAt = ok ? a.length : Math.floor(rnd() * a.length);
  for (let i = 0; i <= Math.min(failAt, a.length - 1); i++) {
    say(m, '●'.repeat(i + 1) + '○'.repeat(Math.max(0, a.length - i - 1)));
    await pause(350 + rnd() * 300);
  }
  return ok;
}

// 担当の出番：問いが出たら担当が先に、少しあとで全員。1番に押した人が答え、2・3番目は保険
async function flow(q, own) {
  const qs = G.qs;
  const base = q.ask * CHAR_MS;
  let openMs = () => base, label = '早押し：問いが出たら誰でも押せる';
  if (own.length) {
    openMs = m => own.includes(m) ? base : base + OWNER_HEAD_MS;
    label = `${own.map(m => m.name).join('・')}の出番`;
  }
  G.lockText = label;
  const r = await reveal(label, openMs);
  if (!r) { caption('誰も押さなかった', 'bad'); logEv('誰もわからず、押さなかった', 'bad'); return; }
  const chain = [r.m];
  qs.first = r.m;
  caption(own.length > 0 && !own.includes(r.m) ? `${r.m.name}が担当より先に押した！` : `${r.m.name}が押した！`);
  say(r.m, '1番！');
  // 保険は2戦目から。1戦目は押した人だけが答える
  if (opened('insure')) await insure(r, chain);
  for (let i = 0; i < chain.length; i++) {
    const m = chain[i];
    if (i > 0) { G.shown = [...q.text].length; caption(`保険${i}：${m.name}が答え直す`); }
    const ok = await answer(m);
    if (m.player) { noteStat(q.id, 1); if (ok) noteStat(q.id, 2); sendAnswer(q.id, ok); }
    if (ok) {
      hit(m, q, { first: i === 0, quick: r.quick });
      if (i === 0 && own.includes(m)) G.stat.ownerOk++;
      if (i === 0 && r.quick) G.stat.quick++;
      if (i > 0) G.stat.insured++;
      qs.ok = true; qs.by = m;
      return;
    }
    miss(m);
    await pause(700);
  }
}
async function insure(r, chain) {
  const you = player();
  G.qphase = 'insure';
  setPhase('insure', '保険に入れる', INSURE_MS);
  const rest = G.party.filter(m => m !== r.m);
  G.ctrl = !AUTO && rest.includes(you) ? 'insure' : 'watch';
  G.watchText = `${r.m.name}が押した。ほかの仲間が保険に入るか…`;
  const iplans = rest.filter(cpuControlled).map(m => m.k.react != null ? { m, at: 200 + rnd() * 1100 } : null)
    .filter(Boolean).sort((a, b) => a.at - b.at);
  for (let t = 0; t < INSURE_MS && chain.length < 3; t += STEP) {
    if (!AUTO && rest.includes(you) && !chain.includes(you) && take('buzz')) { chain.push(you); say(you, `保険${chain.length - 1}`); }
    while (iplans.length && iplans[0].at <= t && chain.length < 3) { const p = iplans.shift(); chain.push(p.m); say(p.m, `保険${chain.length - 1}`); }
    await step();
  }
}

// ===== 報酬は3種類だけ：札を足す・札を抜く・技をもらう =====
const ownedGenres = () => Object.keys(GENRES).filter(g => owners(g).length);
const skillOffer = () => shuffle(Object.keys(SKILLS).filter(k => !G.skills[k])).slice(0, 2);
async function reward() {
  G.rewardStep = null; G.offer = skillOffer();
  G.screen = 'reward'; pending = [];
  const auto = () => G.rewardStep === null ? (['skill', 'add', 'cut'][G.bi] || 'add')
    : G.rewardStep === 'skill' ? (G.offer.includes('convert') ? 'convert' : G.offer[0])
    : G.rewardStep === 'add' ? player().fav[0]
    : (G.table.find(c => !owners(c.g).length) || G.table[0]).g;
  for (;;) {
    const p = AUTO ? { type: 'reward', v: auto() } : pending.shift();
    if (!p) { await step(); continue; }
    if (p.type === 'back') { G.rewardStep = null; render(); continue; }
    if (p.type !== 'reward') continue;
    const st = G.rewardStep, v = p.v;
    if (st === null) {
      if (v === 'skill' && !G.offer.length) continue;
      G.rewardStep = v; render(); continue;
    }
    if (st === 'add' && GENRES[v]) { G.table.push(mkCard(v), mkCard(v)); logEv(`報酬：出題表に${GENRES[v]}の札を2枚足した`); break; }
    if (st === 'cut' && GENRES[v]) {
      const i = G.table.findIndex(c => c.g === v);
      if (i >= 0 && G.table.length > 3) G.table.splice(i, 1);
      logEv(`報酬：出題表から${GENRES[v]}の札を1枚抜いた`); break;
    }
    if (st === 'skill' && G.offer.includes(v)) { G.skills[v] = true; logEv(`報酬：技「${SKILLS[v].name}」をもらった`); break; }
  }
  G.screen = 'battle'; G.q = null; G.bub = {}; G.cap = { text: '', cls: '' };
}

render();
if (AUTO) { const m = location.hash.match(/auto-(\w+)/); if (m && CREW.some(c => c.id === m[1])) setup.me = m[1]; startRun(); }
</script>
