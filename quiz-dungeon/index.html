  // 得意2つはキャラごとに決まっている。あなたが動かすときは2つともレベルを上げる
  const fav = favOf(me);
  const you = { id: me.id, name: me.name, persona: me.persona, player: true, bias: 1, fav, lv: { ...me.lv, ...Object.fromEntries(fav.map(g => [g, Math.max(FAV_LV, me.lv[g])])) } };
  // アクセサリーはあなた（人が動かす席）だけが持つ。自動プレイでは効かせない（dsim の数字を変えないため）
  if (!AUTO) you.hints = JSON.parse(JSON.stringify(hbook.set));
  G = {
    screen: 'battle', party: [you, ...CREW.filter(m => m.id !== me.id).map(m => ({ ...m, lv: { ...m.lv } }))],
    hp: 100, maxHp: 100, bi: 0, enemy: null, q: null, shown: 0, bub: {}, cap: { text: '', cls: '' },
    ph: null, ctrl: null, qphase: null, logOpen: false, sel: [], queue: [], hold: null, ki: KI_MAX,
    table: Object.keys(GENRES).map(g => mkCard(g)), tablePile: [],
    skills: {}, solved: new Set(), used: new Set(), combo: { g: null, n: 0 },
    highlights: [], log: [], plans: 0, bplans: 0,
    stat: { q: 0, ok: 0, quick: 0, allOk: 0, swap: 0, redraw: 0, skill: 0, combo: 0 },
  };
  if (CO.on && CO.host) coopSeat();
  pending = [];
  launch();
}
function launch(resumed = false) {
  runGame(resumed).catch(err => { if (err === QUIT) { dropRun(); G = null; lastHtml = ''; render(); return; } console.error(err); caption('うまく動かなかった。タイトルから入り直してください', 'bad'); render(); window.__ERROR = err.message; });
}

async function runGame(resumed = false) {
  for (G.bi = resumed ? G.bi : 0; G.bi < ENEMIES.length; G.bi++) {
    const d = ENEMIES[G.bi];
    // 続きから：保存した所（問題の合間か、報酬を選ぶ前）から始める。敵・手札・気力はそのとき残したもの
    if (resumed) {
      resumed = false;
      if (G.saveAt === 'reward') { await rewardStep(); continue; }
      G.screen = 'battle'; caption('続きから'); render(); banner(d.name, '続きから', 'neon');
      logEv(`■ 続きから再開した（${d.name}の体力${G.enemy.hp}、共有体力${G.hp}）`);
    } else {
    const hp0 = Math.round(d.hp * FOE_HP_MUL);
    G.enemy = { ...d, hp: hp0, maxHp: hp0, pile: [] };
    G.enemy.pile = enemyDeck(G.enemy);
    G.tablePile = shuffle(G.table.map(c => ({ ...c, id: ++cardSeq, src: 'table' })));
    G.queue = []; G.hold = null; G.keptThisBattle = false; G.combo = { g: null, n: 0 }; G.ki = KI_MAX; G.bplans = 0;
    fillQueue();
    G.screen = 'battle'; G.q = null; G.bub = {};
    caption(`${d.name}が現れた`);
    render(); banner(d.name, d.boss ? 'ボス戦' : `${G.bi + 1}体目が現れた`, d.boss ? 'red' : 'neon');
    logEv(`■ ${d.name}が現れた。体力${d.hp}、出してくるジャンルは${d.gs.length > 5 ? '全部' : d.gs.map(g => GENRES[g]).join('・')}。気力が${KI_MAX}に戻った`);
    const fresh = NEWS[G.bi];
    if (fresh) logEv(`★ この戦闘から：${fresh}`);
    }
    while (G.enemy.hp > 0 && G.hp > 0) { saveRun('q'); await playQuestion(); }
    if (G.enemy.hp <= 0) { banner('撃破', d.name, 'good'); await pause(1000); }
    if (G.hp <= 0) break;
    await rewardStep();
  }
  dropRun();
  G.clear = G.hp > 0;
  if (!AUTO && !CO.on) G.best = noteRun(G.clear ? ENEMIES.length : G.bi, G.clear ? G.hp : 0);
  banner(G.clear ? '踏破' : '全滅', '', G.clear ? 'good' : 'red');
  G.screen = 'end'; G.ctrl = null; render();
  if (CO.on && CO.host) coopSync(true);
  window.__RESULT = { clear: G.clear, bi: G.bi, hp: G.hp, stat: G.stat, table: G.table.length };
}

function pickQuestion(g, m) {
  // まだ正解していない問題を優先し、その中でも出していないものを先に
  const all = QUESTIONS.filter(q => q.g === g);
  const tiers = [
    all.filter(q => q.m === m && !G.solved.has(q.id) && !G.used.has(q.id)),
    all.filter(q => !G.solved.has(q.id) && !G.used.has(q.id)),
    all.filter(q => !G.used.has(q.id)),
    all,
  ];
  const q = pick(tiers.find(t => t.length));
  G.used.add(q.id);
  return q;
}

// 作戦タイム：予告の列をいじる
async function plan() {
  G.plans++; G.bplans++;
  G.qphase = 'plan'; G.q = null; G.sel = []; G.showAns = false; G.bub = {};
  setPhase('plan', '作戦タイム', 1);
  if (AUTO) { autoPlan(); return; }
  G.ctrl = 'plan';
  pending = [];
  for (;;) {
    const p = pending.shift();
    if (p) {
      if (p.type === 'go') break;
      if (p.peer) {
        // 友達の操作：選んだ札の番号も一緒に来る
        const actor = G.party.find(m => m.peer === p.peer);
        if (!actor || !['swap', 'redraw', 'skill'].includes(p.type)) continue;
        G.sel = (Array.isArray(p.sel) ? p.sel : []).filter(i => Number.isInteger(i) && i >= 0 && i < G.queue.length).slice(0, 2);
        doOp(p.type, p.v, actor);
      } else doOp(p.type, p.v);
    }
    await step();
  }
  G.sel = [];
}
function doOp(type, v, actor = player()) {
  G.queueAnim = false;
  const s = G.sel.map(i => G.queue[i]);
  const pay = n => { if (G.ki < n) return false; G.ki -= n; return true; };
  if (type === 'swap' && s.length === 2 && !s.some(locked) && pay(COST.swap)) {
    const [a, b] = G.sel; [G.queue[a], G.queue[b]] = [G.queue[b], G.queue[a]];
    G.stat.swap++; sfx('card'); caption('入れ替えた'); logEv(`入れ替え：${GENRES[G.queue[a].g]}と${GENRES[G.queue[b].g]}の順番を替えた（気力-1）`);
  } else if (type === 'redraw' && s.length === 1 && !locked(s[0]) && pay(COST.redraw)) {
    G.queue[G.sel[0]] = draw();
    G.stat.redraw++; sfx('card'); caption(`${GENRES[s[0].g]}の札を捨てて、${GENRES[G.queue[G.sel[0]].g]}を引いた`); logEv(`引き直し：${GENRES[s[0].g]}を捨てて${GENRES[G.queue[G.sel[0]].g]}を引いた（気力-2）`);
  } else if (type === 'skill') {
    const sk = SKILLS[v];
    if (v === 'keep' && G.hold) { G.queue.unshift(G.hold); G.hold = null; G.queue.length = Math.min(G.queue.length, sightN() + 1); caption('とっておきの札を先頭に出した'); sfx('card'); G.sel = []; return; }
    if (!sk || G.ki < sk.cost) return;
    let done = false;
    const c = s[0];
    if (v === 'convert' && s.length === 1 && !locked(c) && !actor.fav.includes(c.g)) {
      const to = actor.fav[0];
      c.g = to; done = true; caption(`札を${GENRES[to]}に書き換えた`);
    }
    if (v === 'level' && s.length === 1 && !locked(c)) {
      if (c.m) { c.m = false; c.hard = false; caption('札をふつうにした'); }
      else { c.m = true; c.hard = true; caption('札をマニアックにした。当てればダメージ2倍'); }
      done = true;
    }
    if (v === 'keep' && s.length === 1 && !locked(c) && !G.keptThisBattle) {
      G.hold = c; G.queue.splice(G.sel[0], 1); fillQueue(); G.keptThisBattle = true; done = true; caption('札を取り置いた');
    }
    if (done) { G.ki -= sk.cost; G.stat.skill++; sfx('card'); logEv(`技「${sk.name}」：${G.cap.text}（気力-${sk.cost}）`); }
  }
  G.sel = [];
}
// 自動プレイ用：得意な仲間のいない札を引き直し、宗旨替えがあれば使う
function autoPlan() {
  if (/noplan/.test(location.hash)) return;
  for (let i = 0; i < G.queue.length; i++) {
    const c = G.queue[i];
    if (locked(c) || fans(c.g).length) continue;
    if (G.skills.convert && G.ki >= 2) { G.sel = [i]; doOp('skill', 'convert'); }
    else if (G.ki >= 2 && opened('redraw')) { G.sel = [i]; doOp('redraw'); }
    else if (i === 0 && G.ki >= COST.swap) {
      // 1戦目は入れ替えだけ：得意な仲間のいる札を「いま」に持ってくる
      const j = G.queue.findIndex((x, k) => k > 0 && !locked(x) && fans(x.g).length);
      if (j > 0) { G.sel = [0, j]; doOp('swap'); }
    }
  }
}

async function playQuestion() {
  await plan();
  // 先頭の札が手札から場へ出る
  const card = G.queue.shift();
  G.queueAnim = true;
  fillQueue();
  const q = pickQuestion(card.g, card.m);
  // 出題した時点の正解率を出す（この問題で答えた分は次に出たときから反映）
  G.qrate = shared[q.id]?.[0] ? { who: 'みんな', t: shared[q.id][0], o: shared[q.id][1] }
    : qstats[q.id]?.[1] ? { who: 'あなた', t: qstats[q.id][1], o: qstats[q.id][2] } : null;
  noteStat(q.id, 0);
  G.q = q; G.card = card; G.shown = 0; G.bub = {}; G.active = null; G.showAns = false; G.ctrl = 'watch'; G.chain = []; G.cans = null;
  pending = [];
  const qs = { first: null, by: null, ok: false };
  G.qs = qs;
  for (const m of G.party) m.k = rollKnowledge(m, q);
  G.qphase = 'preview';
  setPhase('preview', `${GENRES[q.g]}・${q.m ? 'マニアック' : 'ふつう'}`, PREVIEW_MS);
  render();
  banner(GENRES[q.g], q.m ? 'マニアック' : 'ふつう', '');
  caption('');
  logEv(`▶ 第${G.stat.q + 1}問　${GENRES[card.g]}${card.m ? '・マニアック' : ''}${card.big ? '・大技' : ''}`);
  G.watchText = card.big ? `大技：外すと全員に${cardAtk(card)}ダメージ` : `外すと全員に${cardAtk(card)}ダメージ`;
  await pause(PREVIEW_MS);

  await flowAll(q);
  saveStats();

  G.showAns = true; G.shown = [...q.text].length; G.shownAll = null; G.ctrl = null; G.active = null;
  G.stat.q++;
  if (qs.ok) {
    G.stat.ok++;
    G.solved.add(q.id);
  } else {
    const d = cardAtk(card);
    G.hp = Math.max(0, G.hp - d);
    render(); floatText('#b-party .ours .bar', `-${d}`, 'hurt'); hurtFx();
    if (!card.big) sfx('hurt');
    if (card.big) banner('大技', `共有体力 -${d}`, 'red');
    caption(`${G.enemy.name}の${card.big ? '大技' : '攻撃'}！ ${d}ダメージを受けた`, 'bad');
    logEv(`× 誰も取れず、${G.enemy.name}の${card.big ? '大技' : '攻撃'}で共有体力 -${d}${opened('combo') && G.combo.n >= 2 ? '（コンボも途切れた）' : ''}`, 'bad');
    G.combo = { g: null, n: 0 };
  }
  G.qphase = 'done';
  setPhase('result', qs.ok ? '正解' : '失敗', 2400);
  await pause(2400);
}

// 倍率は4つだけ：早押し・弱点・難化・コンボ。早押し以外は答える前に予告の札に出ている
function damageFor(m, q, o) {
  const L = lvOf(m, q.g);
  // 攻めのアクセサリーは基本ダメージに足す（倍率の名前は増やさない）
  const acc = hintOf(m, q.g)?.atk || 0;
  const base = Math.round(6 + 1.5 * L) + acc;
  let d = base, tags = [], parts = [`${m.name}の${GENRES[q.g]}Lv${L}${acc ? `＋攻め${acc}` : ''}で基本${base}`];
  const mul = (x, label) => { d *= x; tags.push(label); parts.push(`${label}×${x}`); };
  if (o.first && o.quick) mul(1.5, '早押し');
  if (G.enemy.weak === q.g) mul(1.5, '弱点');
  // 難しさ：技で難化した札は2倍、もともとマニアックの札は1.5倍（被弾が1.3倍になる分の見返り）
  if (G.card.hard) mul(2, '難化');
  else if (G.card.m) mul(1.5, 'マニアック');
  const n = comboNext(q.g);
  if (opened('combo') && n >= 2) { mul(comboMul(n), `コンボ${n}`); G.stat.combo++; }
  G.combo = { g: q.g, n };
  return { d: Math.round(d), tags, parts, n };
}
// 友達が席にいるときは、通信の遅れの分（NET_LAG_MS）だけ締めるのを待つ。
// 友達は自分の画面で押した時刻（問題文が出始めてから何ms か）を送ってくるので、届くのが遅れても押した順で決まる
const NET_LAG_MS = 300;

// ===== 出題：全員が押して、それぞれ答える（ひとりでも協力でも同じ） =====
// 問いが出たら誰でも押せ、押した人はそれぞれ自分の文字パネルで答える（CPU の仲間も答える）。正解した人ぜんぶのダメージを足し、
// 全員正解ならさらに倍率。外しても被弾はなく、誰も正解できなければ敵の攻撃。
// ダメージは1人ずつ damageFor で出すので、得意で攻撃力が上がる類いの仕組みは damageFor に足せばそのまま効く
const ANSWER_MS = 9000;  // 押してから答えられる時間
const ALL_BONUS = 1.5;        // 全員正解の倍率
const FOE_HP_MUL = 2;         // 全員が答えて削る分、敵の体力を増やす（仮）
async function flowAll(q) {
  const own = fans(q.g);
  const qs = G.qs, len = [...q.text].length, ask = q.ask * CHAR_MS, pressEnd = len * CHAR_MS + GRACE_MS;
  const quick = (m, at) => at <= ask + QUICK_MS + (hintOf(m, q.g)?.quick || 0);
  const lag = G.party.some(m => m.peer) ? NET_LAG_MS : 0;
  const S = {}; G.cans = S;
  const label = GENRES[q.g];
  G.qphase = 'reveal'; G.lockText = label;
  setPhase('reveal', label, pressEnd);
  const you = player();
  for (let t = 0; ; t += STEP) {
    // 押したら、あなたの画面の問題文はそこで止まる（ほかの人は読み続ける）
    G.shownAll = Math.min(len, Math.floor(t / CHAR_MS) + 1);
    G.shown = !AUTO && S[you.id] ? S[you.id].shown : G.shownAll;
    if (!AUTO) {
      const s = S[you.id];
      if (!s) {
        G.ctrl = t < pressEnd ? 'buzz' : 'watch';
        if (t >= pressEnd) takeBy('buzz', you);
        else if (takeBy('buzz', you)) {
          S[you.id] = { at: t, shown: G.shown }; sfx('buzz');
          G.panel = mkPanel(q, you); G.ctrl = 'panel'; say(you, 'はい！');
        }
      } else if (!s.done && (G.panel?.done || t > s.at + ANSWER_MS)) {
        s.done = true; s.ok = !!(G.panel?.done && G.panel.ok);
        noteStat(q.id, 1); if (s.ok) noteStat(q.id, 2); sendAnswer(q.id, s.ok);
        G.panel = null; G.ctrl = 'watch'; G.watchText = 'みんなの答えを待っています'; say(you, 'これだ！');
      }
    }
    for (const m of G.party) if (m.peer) {
      const s = S[m.id];
      if (!s) {
        const p = takeBy('buzz', m);
        if (!p) continue;
        const claim = Number.isFinite(+p.at) ? +p.at : t;
        if (claim > pressEnd + lag) continue;
        S[m.id] = { at: clamp(claim, 0, t) }; say(m, 'はい！'); sfx('pip');
      } else if (!s.done) {
        const p = takeBy('ansdone', m);
        if (p) { s.done = true; s.ok = [q.a, ...(q.alt || [])].includes(String(p.s || '').slice(0, 40)); say(m, 'これだ！'); }
        else if (t > s.at + ANSWER_MS + 2 * lag) { s.done = true; s.ok = false; say(m, '時間切れ'); }
      }
    }
    for (const m of G.party) if (cpuControlled(m)) {
      const s = S[m.id];
      if (!s && m.k.react != null && t >= ask + m.k.react && t < pressEnd) { S[m.id] = { at: t, end: t + 1200 + rnd() * 1800 }; say(m, 'はい！'); sfx('pip'); }
      else if (s && !s.done && t >= s.end) { s.done = true; s.ok = m.k.knows ? rnd() < 0.95 : rnd() < 0.08; say(m, 'これだ！'); }
    }
    // 友達が途中で抜けたら、その席の答えは外れとして締める
    for (const m of G.party) if (S[m.id] && !S[m.id].done && !m.peer && !m.player && S[m.id].end == null) { S[m.id].done = true; S[m.id].ok = false; }
    const busy = G.party.some(m => S[m.id] && !S[m.id].done);
    if (!busy && (t >= pressEnd || G.party.every(m => S[m.id]))) break;
    if (t >= pressEnd && G.ph.key === 'reveal') setPhase('answer', '解答中', ANSWER_MS);
    await step();
  }
  G.panel = null; G.ctrl = 'watch'; G.watchText = '';
  const order = G.party.filter(m => S[m.id]?.ok).sort((a, b) => S[a.id].at - S[b.id].at);
  for (const m of G.party) if (S[m.id] && !S[m.id].ok) say(m, '外した…', 'bad');
  if (!order.length) { sfx('wrong'); caption('誰も正解できなかった', 'bad'); logEv('誰も正解できなかった', 'bad'); return; }
  const c0 = { ...G.combo };
  let total = 0;
  order.forEach((m, i) => {
    G.combo = { ...c0 };
    const r = damageFor(m, q, { first: i === 0, quick: i === 0 && quick(m, S[m.id].at) });
    total += r.d; say(m, '正解！', 'good');
    logEv(`○ ${m.name}が正解：${r.parts.join(' ')} ＝ ${r.d}`, 'good');
  });
  G.combo = { g: q.g, n: c0.g === q.g ? c0.n + 1 : 1 };
  const all = order.length === G.party.length;
  if (all) {
    total = Math.round(total * ALL_BONUS);
    logEv(`★ 全員正解ボーナス ×${ALL_BONUS}`, 'good'); G.stat.allOk = (G.stat.allOk || 0) + 1; G.highlights.push('全員正解');
  }
  G.enemy.hp = Math.max(0, G.enemy.hp - total);
  G.hitFlash = true; setTimeout(() => { if (G) G.hitFlash = false; }, 500);
  render();
  floatText('#b-top .hpline .bar.foe', `-${total}`, 'dmg' + (total >= 20 ? ' big' : '')); foeHit();
  banner(all ? '全員正解' : quick(order[0], S[order[0].id].at) ? '早押し' : `${order.length}人正解`, `${G.enemy.name}に${total}ダメージ`, 'good');
  caption(`${order.map(m => m.name).join('・')}が正解！ ${all ? '全員正解ボーナス！ ' : ''}${G.enemy.name}に${total}ダメージ`, 'good');
  qs.ok = true; qs.by = order[0]; qs.first = order[0];
  if (quick(order[0], S[order[0].id].at)) G.stat.quick++;
}
// ===== 報酬は3種類だけ：札を足す・札を抜く・技をもらう =====
const ownedGenres = () => Object.keys(GENRES).filter(g => fans(g).length);
const skillOffer = () => shuffle(Object.keys(SKILLS).filter(k => !G.skills[k])).slice(0, 2);
// 最後の敵のあとは報酬なし。報酬を選ぶ前にも保存して、選ぶ前に閉じたら報酬から続ける
async function rewardStep() {
  if (G.bi >= ENEMIES.length - 1) return;
  saveRun('reward'); await reward();
}
async function reward() {
  G.rewardStep = null; G.offer = skillOffer();
  G.screen = 'reward'; pending = [];
  const auto = () => G.rewardStep === null ? (['skill', 'add', 'cut'][G.bi] || 'add')
    : G.rewardStep === 'skill' ? (G.offer.includes('convert') ? 'convert' : G.offer[0])
    : G.rewardStep === 'add' ? player().fav[0]
    : (G.table.find(c => !fans(c.g).length) || G.table[0]).g;
  for (;;) {
    const p = AUTO ? { type: 'reward', v: auto() } : pending.shift();
    if (!p) { await step(); continue; }
    if (p.type === 'back') { G.rewardStep = null; render(); continue; }
    if (p.type !== 'reward') continue;
    const st = G.rewardStep, v = p.v;
    if (st === null) {
      if (v === 'skill' && !G.offer.length) continue;
      G.rewardStep = v; render(); continue;
    }
    if (st === 'add' && GENRES[v]) { G.table.push(mkCard(v), mkCard(v)); logEv(`報酬：出題表に${GENRES[v]}の札を2枚足した`); break; }
    if (st === 'cut' && GENRES[v]) {
      const i = G.table.findIndex(c => c.g === v);
      if (i >= 0 && G.table.length > 3) G.table.splice(i, 1);
      logEv(`報酬：出題表から${GENRES[v]}の札を1枚抜いた`); break;
    }
    if (st === 'skill' && G.offer.includes(v)) { G.skills[v] = true; logEv(`報酬：技「${SKILLS[v].name}」をもらった`); break; }
  }
  G.screen = 'battle'; G.q = null; G.bub = {}; G.cap = { text: '', cls: '' };
}

// ===== 友達と対戦（ジャンル持ち寄り。マジアカの決勝の形） =====
// claude.ai の room で、同じページを開いている人どうしをつなぐ。部屋を作った人（主）の画面が進行と採点を受け持ち、
// いまの状態を st で全員に配る。答えは全員が ans で主に送る。room の無い所（GitHub Pages など）では出さない
const VS_QN = 3;                // 1人が持ち寄ったジャンルから出す問題の数
const VS_BASE = 100;            // 正解の基本点。遅くても正解なら満額
const VS_SPEED = [50, 30, 10];  // 正解した人の中で、早い順の上乗せ（速さは味付け）
const VS_AWAY = 50;             // 乗っ取り：ほかの人が持ち寄ったジャンルで、持ち寄った本人より先に（または本人が外して）正解したときの上乗せ
const VS_EXTRA_MS = 8000;       // 問題文が出きってから答えられる時間
const VS_RESULT_MS = 3600;      // 1問ごとの結果を見せる時間
const VS_MAX = 4;
const VS = { room: null, r: null, code: '', host: false, mode: 'vs', hostSeen: null, err: '', typed: '', crew: null, genre: null, hard: false,
  view: null, st: null, offs: [], t0: 0, panel: null, sent: -1, lastSent: '', lastAt: 0, timer: 0, game: null };
(async () => {
  for (let i = 0; i < 30 && !window.claude?.use; i++) await sleep(100);
  try { const r = await window.claude?.use?.('room'); if (r) { VS.room = r; if (!G) render(); } } catch {}
})();
const vsPeersNow = () => VS.r ? VS.r.peers() : [];
const vsMe = () => vsPeersNow().find(p => p.sameTab);
const vsPlayers = () => vsPeersNow().filter(p => p.presence?.vs === 1 && CREW.some(c => c.id === p.presence.crew));
const vsHostPeer = () => vsPeersNow().find(p => p.presence?.vs === 1 && p.presence.host && !p.sameTab);
const vsLimit = q => [...q.text].length * CHAR_MS + VS_EXTRA_MS;

async function vsOpen(code, host) {
  if (!VS.room || VS.r) return;
  Object.assign(VS, { err: '', code, host, view: 'lobby', st: null, game: null, hostSeen: null, panel: null, sent: -1, lastSent: '' });
  if (host && !VS.crew) VS.crew = setup.me;
  render();
  try { VS.r = await VS.room.join('vs-' + code); }
  catch (e) {
    VS.view = null;
    VS.err = e?.code === 'not_permitted' ? 'このページの共有のされ方では、部屋を使えません' : '部屋に入れませんでした。少し待ってもう一度試してください';
    lastHtml = ''; render(); return;
  }
  VS.offs = [
    VS.r.onPeers(vsOnPeers),
    VS.r.on('st', m => { if (!m.sameTab && !VS.host && (!vsHostPeer() || vsHostPeer().peer === m.peer)) { VS.hostSeen = m.peer; vsApply(m.data); } }),
    VS.r.on('ans', m => { if (!m.sameTab) { if (m.data?.c) coopOnMsg(m.peer, m.data); else vsOnAns(m.peer, m.data); } }),
  ];
  vsPresence();
  VS.timer = setInterval(vsTick, 100);
  render();
}
function vsPresence() { VS.r?.presence({ vs: 1, host: VS.host, crew: VS.crew, genre: VS.genre, hard: VS.hard, acc: hbook.set }).catch(() => {}); }
async function vsLeave(msg = '') {
  if (CO.on) coopEnd();
  for (const off of VS.offs) off();
  clearInterval(VS.timer);
  const r = VS.r;
  Object.assign(VS, { offs: [], r: null, view: null, st: null, game: null, host: false, hostSeen: null, panel: null, timer: 0, err: msg });
  try { await r?.leave(); } catch {}
  lastHtml = ''; render();
}
function vsOnPeers(ch) {
  if (!VS.r) return;
  if (!VS.host) {
    const hp = vsHostPeer();
    if (hp) VS.hostSeen = hp.peer;
    if (VS.hostSeen && ch.left.some(p => p.peer === VS.hostSeen)) { vsLeave('部屋を作った人が抜けたので、部屋を閉じました'); return; }
  }
  // 選んでいた顔を、先にいた人も選んでいたら外す（同時に選んだときは、先に部屋にいた人が優先）
  const mine = vsMe();
  if (VS.crew && mine && !VS.game && !VS.st?.players) {
    const others = vsPeersNow().filter(p => !p.sameTab && p.presence?.vs === 1 && p.presence.crew === VS.crew);
    if (others.some(p => vsPeersNow().indexOf(p) < vsPeersNow().indexOf(mine))) { VS.crew = null; vsPresence(); }
  }
  if (CO.on && CO.host && ch.left.length) coopOnLeft(ch.left);
  if (VS.host && ch.joined.length) vsSync(true);
  render();
}

// ---- 主だけが持つ進行 ----
function vsStart() {
  if (VS.mode === 'coop') { coopStart(); return; }
  const seen = new Set();
  const ps = vsPlayers().filter(p => GENRES[p.presence.genre] && !seen.has(p.presence.crew) && seen.add(p.presence.crew))
    .sort((a, b) => (b.sameTab ? 1 : 0) - (a.sameTab ? 1 : 0)).slice(0, VS_MAX);
  if (ps.length < 2) return;
  // 持ち寄ったジャンルから VS_QN 問ずつ。選んだ難しさを優先し、足りなければ同じジャンルのほかの難しさから
  const used = new Set(), qs = [];
  for (const p of ps) {
    const g = p.presence.genre, hard = !!p.presence.hard;
    const pool = [...shuffle(QUESTIONS.filter(q => q.g === g && q.m === hard)), ...shuffle(QUESTIONS.filter(q => q.g === g && q.m !== hard))];
    let n = 0;
    for (const q of pool) { if (n >= VS_QN) break; if (!used.has(q.id)) { used.add(q.id); qs.push({ id: q.id, by: p.peer }); n++; } }
  }
  VS.game = { players: ps.map(p => ({ peer: p.peer, crew: p.presence.crew, genre: p.presence.genre, hard: !!p.presence.hard, acc: cleanAcc(p.presence.acc), score: 0, ok: 0 })),
    qs, i: -1, ans: {}, res: null, phase: 'q', at: 0 };
  vsNext();
}
function vsNext() {
  const g = VS.game;
  g.i++; g.ans = {}; g.res = null; g.at = Date.now();
  g.phase = g.i >= g.qs.length ? 'end' : 'q';
  vsSync(true);
}
function vsOnAns(peer, d) {
  const g = VS.game;
  if (!VS.host || !g || g.phase !== 'q' || !d || typeof d !== 'object') return;
  const p = g.players.find(x => x.peer === peer);
  if (!p || g.ans[peer] || d.i !== g.i || typeof d.s !== 'string') return;
  const q = QBY[g.qs[g.i].id];
  const s = d.s.slice(0, 40);
  g.ans[peer] = { ok: [q.a, ...(q.alt || [])].includes(s), ms: clamp(Math.round(+d.ms) || 0, 0, vsLimit(q)), s };
  vsSync(true);
}
function vsScore() {
  const g = VS.game;
  const ok = g.players.filter(p => g.ans[p.peer]?.ok).sort((a, b) => g.ans[a.peer].ms - g.ans[b.peer].ms);
  g.res = g.players.map(p => {
    const a = g.ans[p.peer], k = ok.indexOf(p);
    const own = g.ans[g.qs[g.i].by];
    const away = a?.ok && g.qs[g.i].by !== p.peer && !(own?.ok && own.ms <= a.ms) ? VS_AWAY : 0;
    // 攻めのアクセサリー：そのジャンルで正解すると +攻め×5点
    const atk = a?.ok ? (hintOf({ hints: p.acc }, QBY[g.qs[g.i].id].g)?.atk || 0) * 5 : 0;
    const pts = a?.ok ? VS_BASE + (VS_SPEED[k] || 0) + away + atk : 0;
    p.score += pts; if (a?.ok) p.ok++;
    return { peer: p.peer, ok: !!a?.ok, ms: a ? a.ms : null, s: a ? a.s : null, pts, k: a?.ok ? k : -1, away: away ? 1 : 0, atk };
  });
  g.phase = 'res'; g.at = Date.now();
  vsSync(true);
}
function vsHostTick() {
  const g = VS.game;
  if (!g) return;
  if (g.phase === 'q') {
    const q = QBY[g.qs[g.i].id];
    const here = new Set(vsPeersNow().map(p => p.peer));
    const waiting = g.players.filter(p => here.has(p.peer) && !g.ans[p.peer]);
    if (!waiting.length || Date.now() - g.at > vsLimit(q) + 800) vsScore();
  } else if (g.phase === 'res' && Date.now() - g.at > VS_RESULT_MS) vsNext();
  vsSync();
}
function vsSync(force) {
  if (!VS.host || !VS.r) return;
  if (CO.on) { coopSync(force); return; }
  const g = VS.game;
  const st = g ? { phase: g.phase, i: g.i, n: g.qs.length, q: g.qs[g.i]?.id || null, by: g.qs[g.i]?.by || null,
    players: g.players.map(p => [p.peer, p.crew, p.genre, p.hard ? 1 : 0, p.score, p.ok]),
    done: g.phase === 'q' ? Object.keys(g.ans) : [], res: g.res } : { phase: 'lobby', mode: VS.mode };
  const s = JSON.stringify(st), now = Date.now();
  if (!force && s === VS.lastSent && now - VS.lastAt < 1500) return;
  if (s !== VS.lastSent) vsApply(st);
  VS.lastSent = s; VS.lastAt = now;
  VS.r.emit('st', st).catch(() => {});
}

// ---- 全員：主から来た状態で画面を作る ----
function vsApply(st) {
  if (!st || typeof st !== 'object') return;
  if (st.coop) { coopApply(st); return; }
  if (CO.on && !CO.host) coopEnd();
  const prev = VS.st;
  VS.st = st;
  VS.view = st.phase === 'lobby' ? 'lobby' : 'game';
  if (st.phase === 'q' && (prev?.phase !== 'q' || prev.i !== st.i)) vsNewQ(st);
  if (st.phase !== 'q') VS.panel = null;
  render();
}
function vsNewQ(st) {
  const q = QBY[st.q];
  VS.t0 = performance.now(); VS.sent = -1; VS.panel = null;
  const me = vsMe();
  if (!q || !me || !(st.players || []).some(p => p[0] === me.peer)) return;
  VS.panel = mkPanel(q, localAcc(), { q });
  noteStat(q.id, 0);
}
function vsPick(ch) {
  const p = VS.panel;
  if (!p || p.done || VS.st?.phase !== 'q') return;
  const i = p.input.length;
  if (p.retry > 0 && !p.targets.some(t => t[i] === ch)) { p.retry--; p.missed = true; p.cands = p.cands.filter(c => c !== ch); render(); return; }
  p.input.push(ch);
  p.targets = p.targets.filter(t => t[i] === ch);
  if (!p.targets.length) { p.done = true; p.ok = false; }
  else if (p.targets.some(t => t.length === p.input.length)) { p.done = true; p.ok = true; }
  else p.cands = panelCands(p, p.q);
  if (p.done) vsSend();
  render();
}
function vsSend() {
  const p = VS.panel, st = VS.st;
  if (!p || !st || VS.sent === st.i) return;
  VS.sent = st.i;
  const d = { i: st.i, s: p.input.join(''), ms: Math.round(performance.now() - VS.t0) };
  if (VS.host) vsOnAns(vsMe()?.peer, d);
  else VS.r?.emit('ans', d).catch(() => {});
  const q = p.q;
  noteStat(q.id, 1); if (p.ok) noteStat(q.id, 2); sendAnswer(q.id, p.ok); saveStats();
}
function vsTick() {
  if (CO.on) { if (CO.host) coopSync(); else coopGuestTick(); return; }
  if (VS.host) vsHostTick();
  const st = VS.st, p = VS.panel;
  if (st?.phase === 'q') {
    // 時間切れ：途中まで入れた分で送る（外れ）
    if (p && !p.done && performance.now() - VS.t0 > vsLimit(p.q)) { p.done = true; p.ok = false; vsSend(); }
    render();
  }
}

// ---- 画面 ----
function vsCard() {
  if (!VS.room) return '';
  return `<div class="card">
    <h2><span class="kick">WITH FRIENDS</span>友達と遊ぶ</h2>
    <p class="muted" style="font-size:.85rem">部屋を作った人が「対戦」か「協力」を選びます。<br><b>対戦</b>：2〜${VS_MAX}人で、1人1つずつジャンルを持ち寄ります。持ち寄ったジャンルから${VS_QN}問ずつ出て、全員が同じ問題に同時に答えます。正解で${VS_BASE}点、正解した中で早い順に${VS_SPEED.map(x => '+' + x).join('・')}。ほかの人が持ち寄ったジャンルで、持ち寄った本人より先に正解すると「乗っ取り」で+${VS_AWAY}。<br><b>協力</b>：友達がねりんずの席に入り、一緒にダンジョンに潜ります。問いが出たら全員が押して、それぞれ答えます。正解した人のダメージを足し、全員正解ならさらに×${ALL_BONUS}。空いた席は CPU が動かします。</p>
    ${VS.err ? `<p class="vs-err">${esc(VS.err)}</p>` : ''}
    <div class="btns"><button data-act="vsmake">部屋を作る</button></div>
    <div class="btns codeline"><input class="codein" id="vscode" inputmode="text" autocapitalize="off" autocomplete="off" spellcheck="false" maxlength="4" placeholder="部屋の名前（4文字）" value="${esc(VS.typed)}" aria-label="部屋の名前"><button data-act="vsjoin">部屋に入る</button></div>
  </div>`;
}
function vsMate(p, coop) {
  const c = crewOf(p.presence.crew), g = coop ? favOf(c).map(x => GENRES[x]).join('・') + 'が得意' : GENRES[p.presence.genre];
  return `<div>${face(c)}<p><b>${esc(c.name)}</b>${p.sameTab ? '（あなた）' : ''}${p.presence.host ? '　部屋を作った人' : ''}<br>
    <span class="muted">${g ? `${g}${p.presence.hard ? '・マニアック' : ''}` : 'ジャンルを選んでいるところ'}</span></p></div>`;
}
function vsLobbyView() {
  const ps = vsPeersNow();
  const takenBy = id => ps.find(p => !p.sameTab && p.presence?.vs === 1 && p.presence.crew === id);
  const players = vsPlayers();
  const ready = players.filter(p => GENRES[p.presence.genre]);
  const coop = (VS.host ? VS.mode : VS.st?.mode) === 'coop';
  const why = !VS.crew ? '顔を選んでください' : coop ? (players.length < 2 ? 'あと1人以上、顔を選んだ人が要ります' : '')
    : !VS.genre ? '持ち寄るジャンルを選んでください' : ready.length < 2 ? 'あと1人以上、ジャンルを選んだ人が要ります' : '';
  return `<div class="logo"><div class="en">${coop ? 'CO-OP' : 'VERSUS'}</div><h1>${coop ? '友達と協力' : '友達と対戦'}</h1></div>
  <div class="card"><h2><span class="kick">MODE</span>遊び方</h2>
    ${VS.host ? `<div class="seg two">${[['vs', '対戦'], ['coop', '協力']].map(([k, n]) => `<button class="${VS.mode === k ? 'on' : ''}" data-act="vsmode" data-v="${k}">${n}</button>`).join('')}</div>` : ''}
    <p class="muted" style="font-size:.85rem">${coop ? `一緒にダンジョンに潜ります。あなたは選んだ顔の席に入ります。問いが出たら全員が押して、それぞれ答えます。正解した人のダメージを足し、全員正解ならさらに×${ALL_BONUS}。外しても被弾はなく、誰も正解できないと敵の攻撃。作戦の札の操作と報酬選びは、誰がやってもかまいません。空いた席は CPU。`
      : '1人1つずつジャンルを持ち寄り、全員が同じ問題に同時に答えます。'}${VS.host ? '' : '<br>遊び方は部屋を作った人が選びます。'}</p>
  </div>
  <div class="card"><h2><span class="kick">ROOM</span>部屋の名前</h2>
    <p class="roomcode">${esc(VS.code)}</p>
    <p class="muted" style="font-size:.85rem">${VS.host ? 'この4文字を友達に伝えてください。友達はこのページを開いて「部屋に入る」に入れます。' : '部屋を作った人が始めるのを待っています。'}${VS.r ? '' : '<br>部屋につないでいます…'}</p>
  </div>
  <div class="card"><h2><span class="kick">FACE</span>あなたの顔</h2>
    <div class="crew">${CREW.map(c => { const t = takenBy(c.id); return `<button class="${VS.crew === c.id ? 'on' : ''}${t ? ' off' : ''}" ${t ? 'aria-disabled="true" data-why="ほかの人が選んでいる顔です"' : ''} data-act="vscrew" data-v="${c.id}">${face(c)}<b>${esc(c.name)}</b><span>${t ? '使用中' : VS.crew === c.id ? 'あなた' : '空き'}</span></button>`; }).join('')}</div>
  </div>
  ${coop ? '' : `<div class="card"><h2><span class="kick">GENRE</span>持ち寄るジャンル</h2>
    <div class="genres">${Object.keys(GENRES).map(g => `<button class="${VS.genre === g ? 'on' : ''}" data-act="vsgenre" data-v="${g}" data-g="${g}">${GENRES[g]}</button>`).join('')}</div>
    <div class="seg two">${[['0', 'ふつう'], ['1', 'マニアック']].map(([k, n]) => `<button class="${(VS.hard ? '1' : '0') === k ? 'on' : ''}" data-act="vshard" data-v="${k}">${n}</button>`).join('')}</div>
    <p class="muted" style="font-size:.8rem">このジャンルから${VS_QN}問出て、全員が答えます。自分が強いジャンルを持ち寄るのが基本。人の持ち寄りで本人より先に正解すると、乗っ取りで+${VS_AWAY}。マニアックは、自分も外しやすくなります。</p>
  </div>`}
  <div class="card"><h2><span class="kick">PLAYERS</span>集まった人（${Math.min(players.length, VS_MAX)}/${VS_MAX}）</h2>
    <div class="mates">${players.map(p => vsMate(p, coop)).join('') || '<p class="muted">つないでいます…</p>'}</div>
    ${players.length > VS_MAX ? `<p class="muted" style="font-size:.8rem">${VS_MAX}人を超えた分は、見ているだけになります。</p>` : ''}
  </div>
  ${VS.host ? `<div class="cta"><button class="big go" data-act="vsstart" ${why ? 'disabled' : ''}>${why || (coop ? '一緒に潜る' : '対戦を始める')}</button></div>` : ''}
  <div class="btns"><button data-act="vsleave">部屋を出る</button></div>`;
}
const vsRow = p => ({ peer: p[0], c: crewOf(p[1]), genre: p[2], hard: !!p[3], score: +p[4] || 0, ok: +p[5] || 0 });
function vsGameView() {
  const st = VS.st, me = vsMe()?.peer;
  const P = (st.players || []).map(vsRow);
  if (st.phase === 'end') return vsEndView(P, me);
  const q = QBY[st.q];
  const res = st.phase === 'res' ? Object.fromEntries((st.res || []).map(r => [r.peer, r])) : {};
  const board = `<div class="vsboard" style="--n:${P.length}">${P.map(p => {
    const r = res[p.peer];
    const tag = st.phase === 'q' ? ((st.done || []).includes(p.peer) ? '<i>回答済み</i>' : '<i class="dim">考え中</i>')
      : r ? (r.ok ? `<i class="ok">+${r.pts}${r.k === 0 && P.length > 1 ? ' 1番' : ''}${r.away ? ' 乗取' : ''}${r.atk ? ' 攻め' : ''}</i>` : `<i class="ng">${r.s == null ? '時間切れ' : '×'}</i>`) : '';
    return `<div class="${p.peer === me ? 'you' : ''} ${st.by === p.peer ? 'by' : ''}">${face(p.c)}<b>${esc(p.c.name)}${p.peer === me ? '（あなた）' : ''}</b><em>${p.score}</em>${tag}</div>`;
  }).join('')}</div>`;
  if (!q) return board;
  const by = P.find(p => p.peer === st.by);
  const el = performance.now() - VS.t0, lim = vsLimit(q);
  const len = [...q.text].length, n = st.phase === 'q' ? Math.min(len, Math.floor(el / CHAR_MS) + 1) : len;
  const text = esc([...q.text].slice(0, n).join('')) + (n < len ? '<span class="cursor"></span>' : '');
  let ctrl;
  if (st.phase === 'res') {
    const mine = res[me];
    ctrl = `<div class="big idle">${mine ? (mine.ok ? `正解！ +${mine.pts}点${mine.away ? `（乗っ取り +${VS_AWAY} 込み）` : ''}${mine.atk ? `（攻め +${mine.atk} 込み）` : ''}` : mine.s ? `あなたの答え：${esc(mine.s)}` : '時間切れ') : '次の問題へ'}</div>`;
  } else if (VS.panel && !VS.panel.done) {
    const p = VS.panel, a = p.targets[0] || [...q.a];
    ctrl = `<div class="input">${a.map((ch, i) => i < p.input.length ? esc(p.input[i]) : '<span class="slot">○</span>').join('')}</div>
      ${p.missed ? '<p class="hint pick">ちがう字。もう一度選べる</p>' : p.retry ? '<p class="hint">手がかり：1文字まちがえてもやり直せる</p>' : ''}
      <div class="pad">${p.cands.map(ch => `<button data-act="vschar" data-v="${esc(ch)}">${esc(ch)}</button>`).join('')}</div>`;
  } else ctrl = `<div class="big idle">${VS.panel ? 'ほかの人を待っています' : '見ているだけ（この対戦には入っていません）'}</div>`;
  return `<div class="vsgame">${board}
    <div class="stage field q">
      <div class="phase"><span class="kick">Q${st.i + 1}/${st.n}</span><span class="t">${by ? `${esc(by.c.name)}の持ち寄り` : ''}</span></div>
      <div class="fcard" data-g="${q.g}">
        <div class="fhead">${chip(q.g)}${q.m ? '<span class="chip mania">マニアック</span>' : ''}</div>
        <div class="bar time"><i style="width:${st.phase === 'q' ? clamp(100 - 100 * el / lim, 0, 100) : 0}%"></i></div>
        <div class="qtext">${text}</div>
        ${st.phase === 'res' ? `<div class="reveal-ans">答え：<b>${esc(q.disp)}</b>${q.yomi !== q.disp ? `（${esc(q.yomi)}）` : ''}${q.note ? '　' + esc(q.note) : ''}</div>` : ''}
      </div>
    </div>
    <div class="ctrl">${ctrl}</div></div>`;
}
function vsEndView(P, me) {
  // 順位は下から1人ずつ明かし、1位を最後に見せる
  const order = [...P].sort((a, b) => b.score - a.score);
  const rank = p => 1 + order.filter(x => x.score > p.score).length;
  const rows = [...order].reverse().map((p, k) => `<li style="--k:${k}" class="${p.peer === me ? 'you' : ''} ${rank(p) === 1 ? 'top' : ''}">
    <span class="rk">${rank(p)}位</span>${face(p.c)}<b>${esc(p.c.name)}${p.peer === me ? '（あなた）' : ''}</b>
    <span class="muted">${GENRES[p.genre] || ''}${p.hard ? '・マニアック' : ''}を持ち寄り／${p.ok}問正解</span><em>${p.score}</em></li>`).join('');
  const mine = P.find(p => p.peer === me);
  return `<div class="result-head ${mine && rank(mine) === 1 ? 'win' : mine ? 'lose' : ''}"><div class="en">${mine ? (rank(mine) === 1 ? 'WINNER' : 'RESULT') : 'RESULT'}</div><h1>対戦の結果</h1></div>
  <ol class="rank">${rows}</ol>
  ${VS.host ? '<div class="cta"><button class="big go" data-act="vsagain">部屋に戻ってもう一度</button></div>' : '<p class="muted" style="text-align:center">部屋を作った人が「もう一度」を押すと、部屋に戻ります。</p>'}
  <div class="btns"><button data-act="vsleave">部屋を出る</button></div>`;
}
function vsAct(act, v) {
  if (act === 'vsmake') {
    const abc = 'abcdefghjkmnpqrstuvwxyz23456789';
    vsOpen(Array.from({ length: 4 }, () => pick([...abc])).join(''), true); return;
  }
  if (act === 'vsjoin') {
    const code = (VS.typed || '').toLowerCase();
    if (!/^[a-z0-9]{4}$/.test(code)) { showWhy('部屋を作った人から聞いた4文字を入れてください'); return; }
    vsOpen(code, false); return;
  }
  if (act === 'vsleave') { vsLeave(); return; }
  if (act === 'vschar') { vsPick(v); return; }
  if (act === 'vscrew' && CREW.some(c => c.id === v)) { VS.crew = v; if (VS.host) setup.me = v; vsPresence(); render(); return; }
  if (act === 'vsgenre' && GENRES[v]) { VS.genre = v; vsPresence(); render(); return; }
  if (act === 'vshard') { VS.hard = v === '1'; vsPresence(); render(); return; }
  if (act === 'vsmode' && VS.host && !VS.game && ['vs', 'coop'].includes(v)) { VS.mode = v; vsSync(true); render(); return; }
  if (act === 'vsstart' && VS.host && !VS.game && !CO.on) { vsStart(); return; }
  if (act === 'vsagain' && VS.host) { VS.game = null; vsSync(true); VS.view = 'lobby'; render(); }
}
document.addEventListener('input', e => { if (e.target.id === 'vscode') VS.typed = e.target.value.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 4); });
document.addEventListener('keydown', e => { if (e.target.id === 'vscode' && e.key === 'Enter') vsAct('vsjoin'); });

// ===== 友達と協力（ねりんずの席に友達が入る） =====
// 部屋とロビーは対戦と同じ。主の画面がいつものゲーム（G）をそのまま回し、友達が入った席（m.peer）は CPU が動かさない。
// 主は G の要約を st で配り（coop: 1。4KB 以内）、友達の画面はそれから G を組み直して同じ画面を描く。
// 友達の操作（押す・答え・札の操作・報酬）は ans で主に送る（c で種類を分ける）。問題文の出方と時間の棒は、友達の画面が手元の時計で進める
const CO = { on: false, host: false, seats: {}, st: null, at: 0, phn: -1, buzzed: false, sel: [], selKey: '', panel: null, panelPhn: -1,
  sent: '', sentAt: 0, fxn: 0, logOpen: false };
const coopMine = () => { const me = vsMe(); return me && G ? G.party.find(m => m.peer === me.peer) : null; };

// ---- 主 ----
function coopStart() {
  const seen = new Set();
  const ps = vsPlayers().filter(p => !seen.has(p.presence.crew) && seen.add(p.presence.crew)).slice(0, CREW.length);
  if (ps.length < 2 || !VS.crew) return;
  setup.me = VS.crew;
  Object.assign(CO, { on: true, host: true, seats: Object.fromEntries(ps.filter(p => !p.sameTab).map(p => [p.presence.crew, p.peer])),
    acc: Object.fromEntries(ps.map(p => [p.peer, cleanAcc(p.presence.acc)])), sent: '', sentAt: 0 });
  VS.view = 'coop'; lastHtml = '';
  startRun();
  coopSync(true);
}
// startRun の中から：友達の席の仲間に peer を付け、あなたと同じく得意2つのレベルを上げる
function coopSeat() {
  for (const m of G.party) {
    const peer = CO.seats[m.id];
    if (!peer || m.player) continue;
    m.peer = peer; m.fav = favOf(crewOf(m.id)); m.hints = CO.acc?.[peer] || {};
    for (const g of m.fav) m.lv[g] = Math.max(FAV_LV, m.lv[g] || 0);
  }
}
function coopOnLeft(left) {
  if (!G) return;
  for (const m of G.party) if (m.peer && left.some(p => p.peer === m.peer)) {
    delete m.peer; logEv(`${m.name}の席の友達が抜けた。ここからは CPU が動かす`, 'bad');
  }
}
function coopOnMsg(peer, d) {
  if (!CO.on || !CO.host || !G || !d || typeof d !== 'object') return;
  const m = G.party.find(x => x.peer === peer);
  if (!m) return; // 席の無い人（見ているだけ）
  if (d.c === 'prog') { if (G.active === m && G.qphase === 'answer') { const n = clamp(+d.n || 0, 0, 20), len = [...G.q.a].length; say(m, '●'.repeat(Math.min(n, len)) + '○'.repeat(Math.max(0, len - n))); } return; }
  if (d.c === 'ans') { pending.push({ type: 'ansdone', peer, s: String(d.s || '') }); return; }
  if (d.c === 'buzz') { pending.push({ type: 'buzz', peer, at: +d.at }); return; }
  if (d.c === 'op' && ['go', 'swap', 'redraw', 'skill', 'reward', 'back'].includes(d.type)) pending.push({ type: d.type, v: typeof d.v === 'string' ? d.v.slice(0, 20) : undefined, sel: d.sel, peer });
}
const coopCard = c => c ? [c.g, c.m ? 1 : 0, c.big ? 1 : 0, c.bossLock ? 1 : 0, c.hard ? 1 : 0] : null;
function coopSnap() {
  const ph = G.ph || { key: '', label: '', dur: 1, t: 0 };
  const st = { coop: 1, sc: G.screen, bi: G.bi, hp: G.hp, ki: G.ki, ehp: G.enemy?.hp ?? 0,
    party: G.party.map(m => [m.id, m.peer || '', m.player || m.peer ? 1 : 0]),
    qu: G.queue.map(coopCard), hold: coopCard(G.hold), card: coopCard(G.card), q: G.q?.id || null, qp: G.qphase,
    phn: G.phn || 0, phk: ph.key, phl: ph.label, phd: ph.dur, sh: G.qphase === 'reveal' || G.qphase === 'answer' ? G.shownAll ?? G.shown : G.shown, sa: G.showAns ? 1 : 0, ok: G.qs?.ok ? 1 : 0,
    act: G.active?.id || null, chain: (G.chain || []).map(m => m.id), bub: Object.fromEntries(Object.entries(G.bub).map(([k, b]) => [k, [b.text, b.cls]])),
    cap: [G.cap.text, G.cap.cls], combo: [G.combo.g, G.combo.n], sk: Object.keys(G.skills), kept: G.keptThisBattle ? 1 : 0, bp: G.bplans,
    lt: G.lockText || '', wt: G.watchText || '', qr: G.qrate || null, qa: G.queueAnim ? 1 : 0, fx: G.fx || null,
    log: G.log.slice(-6).map(l => [l.text, l.cls]), emax: G.enemy?.maxHp ?? 0, qn: G.stat.q,
    cans: G.cans ? Object.fromEntries(Object.entries(G.cans).map(([k, v]) => [k, v.done ? 'd' : 'a'])) : null };
  if (G.screen !== 'battle') Object.assign(st, { tb: G.table.map(c => c.g), rs: G.rewardStep ?? null, of: G.offer || [] });
  if (G.screen === 'end') Object.assign(st, { stat: G.stat, hl: G.highlights.slice(-6), clear: G.clear ? 1 : 0 });
  // 4KB に収める：はみ出すときは記録から削る
  while (new TextEncoder().encode(JSON.stringify(st)).length > 3800 && st.log.length) st.log.shift();
  return st;
}
function coopSync(force) {
  if (!CO.on || !CO.host || !VS.r || !G) return;
  const st = coopSnap(), s = JSON.stringify(st), now = performance.now();
  // 変わったときに送る（多くても1秒に5回）。変わらなくても1.5秒ごとに送り直す（届かなかった分と途中から来た人のため）
  if (!force && (s === CO.sent ? now - CO.sentAt < 1500 : now - CO.sentAt < 200)) return;
  CO.sent = s; CO.sentAt = now;
  st.pht = G.ph ? G.ph.t : 0;
  VS.r.emit('st', st).catch(() => {});
}
function coopBackToRoom() {
  // 主が「部屋に戻る」：ロビーに戻して、友達にも知らせる
  CO.on = false; CO.host = false; CO.seats = {};
  VS.view = VS.r ? 'lobby' : null; VS.game = null;
  vsSync(true);
}
function coopEnd() {
  if (CO.host) { if (G) for (const m of G.party) delete m.peer; } // 主が部屋を出たら、残りは CPU でそのまま続ける
  else { G = null; lastHtml = ''; }
  Object.assign(CO, { on: false, host: false, seats: {}, st: null, panel: null, sel: [] });
}

// ---- 友達の画面 ----
function coopApply(st) {
  if (VS.host) return;
  const first = !CO.on;
  CO.on = true; CO.host = false; VS.view = 'coop'; VS.st = null;
  CO.st = st; CO.at = performance.now();
  if (first) { CO.phn = -1; lastHtml = ''; }
  if (st.phn !== CO.phn) { CO.phn = st.phn; CO.buzzed = false; }
  const key = JSON.stringify(st.qu) + st.qp;
  if (key !== CO.selKey) { CO.selKey = key; CO.sel = []; }
  if (st.fx && st.fx[0] !== CO.fxn) { if (!first) banner(st.fx[1], st.fx[2], st.fx[3]); CO.fxn = st.fx[0]; }
  coopBuild();
  render();
}
const coopUnCard = a => a ? { id: 0, g: a[0], m: !!a[1], big: !!a[2], bossLock: !!a[3], hard: !!a[4], src: '' } : null;
// 主から来た要約で G を組み直す。描く関数（battleView など）は G を読むだけなので、そのまま使える
function coopBuild() {
  const st = CO.st, me = vsMe()?.peer;
  const party = (st.party || []).map(([id, peer, human]) => {
    const c = crewOf(id), m = { ...c, lv: { ...c.lv }, peer: peer || null, player: !!peer && peer === me };
    if (m.player) m.hints = hbook.set; // 自分の札の印・手がかりの表示用（ダメージは主が計算する）
    if (human) { m.fav = favOf(c); for (const g of m.fav) m.lv[g] = Math.max(FAV_LV, m.lv[g] || 0); }
    return m;
  });
  const d = ENEMIES[st.bi] || ENEMIES[0];
  const byId = id => party.find(m => m.id === id) || null;
  G = { screen: st.sc, party, bi: st.bi, hp: st.hp, maxHp: 100, ki: st.ki,
    enemy: { ...d, maxHp: st.emax || d.hp, hp: st.ehp }, queue: (st.qu || []).map(coopUnCard), hold: coopUnCard(st.hold), card: coopUnCard(st.card),
    q: st.q ? QBY[st.q] || null : null, qphase: st.qp, shown: st.sh, showAns: !!st.sa, qs: { ok: !!st.ok }, active: byId(st.act),
    chain: (st.chain || []).map(byId).filter(Boolean),
    bub: Object.fromEntries(Object.entries(st.bub || {}).map(([k, b]) => [k, { text: b[0], cls: b[1] }])),
    cap: { text: st.cap?.[0] || '', cls: st.cap?.[1] || '' }, combo: { g: st.combo?.[0] ?? null, n: st.combo?.[1] || 0 },
    skills: Object.fromEntries((st.sk || []).filter(k => SKILLS[k]).map(k => [k, true])), keptThisBattle: !!st.kept, bplans: st.bp || 0,
    lockText: st.lt, watchText: st.wt, qrate: st.qr, queueAnim: !!st.qa, log: (st.log || []).map(([text, cls]) => ({ text, cls })),
    logOpen: CO.logOpen, sel: CO.sel, ph: { key: st.phk, label: st.phl, dur: st.phd || 1, t: 0 }, ctrl: 'watch', open: 0, panel: null,
    table: (st.tb || []).map(g => mkCard(g)), rewardStep: st.rs ?? null, offer: st.of || [],
    stat: st.stat || { q: 0, ok: 0, quick: 0, allOk: 0, swap: 0, redraw: 0, skill: 0, combo: 0 }, highlights: st.hl || [], clear: !!st.clear };
  coopDerive();
}
// 手元の時計で進める分：時間の棒・問題文の出方・自分のボタン
function coopDerive() {
  const st = CO.st, me = coopMine();
  const t = (st.pht || 0) + (performance.now() - CO.at);
  G.ph.t = Math.min(t, G.ph.dur);
  const q = G.q;
  if (q && G.qphase === 'reveal') G.shown = Math.max(st.sh || 0, Math.min([...q.text].length, Math.floor(t / CHAR_MS) + 1));
  // 自分が押したら、自分の画面の問題文はそこで止める
  if (q && !G.showAns && CO.frozen?.key === `${st.qn}:${q.id}`) G.shown = Math.min(G.shown, CO.frozen.shown);
  G.panel = null; G.ctrl = 'watch';
  if (!me) { G.watchText = G.watchText || '観戦中'; return; }
  if (G.screen !== 'battle') return;
  if (G.qphase === 'plan') G.ctrl = 'plan';
  else if (G.qphase === 'reveal' && q) {
    // 全員が答える：押したら手元に文字パネルを出す（主の返事を待たない）
    const key = `${st.qn}:${q.id}`, p = CO.panel && CO.panelKey === key ? CO.panel : null;
    if (st.cans?.[me.id] === 'd' || p?.done) { G.watchText = 'みんなの答えを待っています'; return; }
    if (p) { G.panel = p; G.ctrl = 'panel'; return; }
    if (st.phk !== 'reveal') { G.watchText = 'この問題は見送り'; return; }
    G.ctrl = 'buzz';
  } else if (G.qphase === 'answer' && G.active === me && q) {
    // 自分の番：文字パネルを手元に出す（答えるたびに作り直さない）
    if (CO.panelPhn !== st.phn) {
      CO.panelPhn = st.phn;
      CO.panel = mkPanel(q, localAcc(), { q, sent: false });
    }
    if (!CO.panel.done) { G.panel = CO.panel; G.ctrl = 'panel'; }
    else G.watchText = 'みんなの答えを待っています';
  }
}
function coopGuestTick() {
  if (!CO.st || !G) return;
  coopDerive(); render();
}
function coopSend(d) { VS.r?.emit('ans', d).catch(() => {}); }
function coopGuestAct(act, v) {
  if (!G) return;
  if (act === 'motion') { motionPref = v; try { localStorage.setItem(MOTION_KEY, v); } catch {} lastHtml = ''; render(); return; }
  if (act === 'sound') { soundPref.on = v === 'on'; saveSound(); wakeAudio(); sfx('correct'); lastHtml = ''; render(); return; }
  if (!coopMine()) return;
  if (act === 'sel') {
    G.queueAnim = false;
    if (G.qphase !== 'plan') return;
    const i = +v, a = CO.sel[0];
    if (a === i) CO.sel = [];
    else if (a == null) CO.sel = [i];
    else {
      const why = [G.queue[a], G.queue[i]].some(c => !c || locked(c)) ? '🔒の札（大技・ボスの札）は入れ替えられない'
        : G.ki < COST.swap ? `気力が足りない（入れ替えに気力${COST.swap}が要る、いまは${G.ki}）` : '';
      if (why) { showWhy(why); CO.sel = [i]; }
      else { coopSend({ c: 'op', type: 'swap', sel: [a, i] }); CO.sel = []; }
    }
    G.sel = CO.sel; render(); return;
  }
  if (act === 'unsel') { CO.sel = []; G.sel = []; render(); return; }
  if (act === 'go' || act === 'redraw' || act === 'skill') { coopSend({ c: 'op', type: act, v, sel: CO.sel }); CO.sel = []; G.sel = []; render(); return; }
  if (act === 'reward' || act === 'back') { coopSend({ c: 'op', type: act, v }); return; }
  if (act === 'buzz') {
    if (G.ctrl !== 'buzz') return;
    CO.buzzed = true; sfx('buzz'); coopSend({ c: 'buzz', at: Math.round((CO.st.pht || 0) + performance.now() - CO.at) });
    if (G.qphase === 'reveal' && G.q) {
      const q = G.q;
      CO.panelKey = `${CO.st.qn}:${q.id}`; CO.frozen = { key: CO.panelKey, shown: G.shown };
      CO.panel = mkPanel(q, localAcc(), { q, sent: false });
    } coopDerive(); render(); return;
  }
  if (act === 'char') {
    const p = CO.panel;
    if (!p || p.done) return;
    G.panel = p; panelPick(v);
    coopSend({ c: 'prog', n: p.input.length });
    if (p.done && !p.sent) {
      p.sent = true;
      coopSend({ c: 'ans', s: p.input.join('') });
      noteStat(p.q.id, 0); noteStat(p.q.id, 1); if (p.ok) noteStat(p.q.id, 2); sendAnswer(p.q.id, p.ok); saveStats();
    }
    coopDerive(); render();
  }
}
app.addEventListener('toggle', e => { if (CO.on && !CO.host && e.target.matches('details.log')) CO.logOpen = e.target.open; }, true);

render();
if (AUTO) { const m = location.hash.match(/auto-(\w+)/); if (m && CREW.some(c => c.id === m[1])) setup.me = m[1]; startRun(); }
// ホーム画面に追加したときにオフラインでも開けるように。https で直接開いたときだけ（claude.ai の中の表示などでは登録しない）
try { if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window && !AUTO) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch {}
</script>
